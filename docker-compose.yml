services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_PROFILE: minimal
    environment:
      ENABLE_SONG_DL_AND_EMBEDINGS: "0"
      STREETPARADE_DB: /data/streetparade_embeddings.sqlite3
      STREETPARADE_VECTOR_STORE: numpy
      STREETPARADE_NUMPY_VECTOR_DIR: /data/vectorstore
      STREETPARADE_CHROMA_DIR: /app/chroma
      STREETPARADE_CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:5173,http://127.0.0.1:5174
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./vectorstore:/data/vectorstore
      - ./chroma:/app/chroma
      - ./.songs_cache:/app/.songs_cache
      - ./hf-cache:/root/.cache/huggingface
    restart: unless-stopped

  fe-admin:
    build:
      context: ./fe-admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  fe-visualizer:
    build:
      context: ./fe-visualizer
      dockerfile: Dockerfile
      args:
        VITE_ENABLE_SONG_DL_AND_EMBEDINGS: "false"
    ports:
      - "3001:80"
    depends_on:
      - api
    restart: unless-stopped
