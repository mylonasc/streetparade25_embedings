services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      STREETPARADE_DB: /data/streetparade_embeddings.sqlite3
      STREETPARADE_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./.songs_cache:/app/.songs_cache
      - ./hf-cache:/root/.cache/huggingface
    restart: unless-stopped

  fe-admin:
    build:
      context: ./fe-admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
