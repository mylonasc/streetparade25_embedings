  - index: 6
    number: 6
    title: 6. SEAQUENCE (ZH)
    name: SEAQUENCE (ZH)
    genres: Future House, EDM, Hypertechno, Drum and Bass
    motto: Tides of Wonder
    time: 14:38 - 18:38
    description: >-
      Tief unter der Wasseroberfläche beginnt eine neue Reise. Die Gezeiten bewegen das Meer, Lichtwellen tanzen in
      Violett, Pink und Blau, und leuchtende Seesterne weisen den Weg durch eine Welt voller Energie und Emotion.
      Fliessende Formen, schimmernde Farben und pulsierende Beats verschmelzen zu einem sinnlichen Rausch. Jeder Klang
      folgt dem Rhythmus des Meeres, jede Bewegung wird Teil der Strömung. Musik wird zur Verbindung – intensiv,
      treibend und voller Gefühl. Tauche ein in das SEAQUENCE-Love Mobile und erlebe Tides Of Wonder – wo Wellen zu
      Emotionen werden, Beats durch die Tiefe tragen und die Magie des Meeres auf der Street Parade lebendig wird.
    image:
      src: https://www.streetparade.com/media/pages/love-mobiles/seaquence-zh/e2ac4c9582-1784902206/seaquence-450x.jpg
