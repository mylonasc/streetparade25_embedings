      6. SEAQUENCE (ZH) 14:38 - 18:38 Tief unter der Wasseroberfläche beginnt eine neue Reise. Die Gezeiten bewegen das
      Meer, Lichtwellen tanzen in Violett, Pink und Blau, und leuchtende Seesterne weisen den Weg durch eine Welt voller
      Energie und Emotion. Fliessende Formen, schimmernde Farben und pulsierende Beats verschmelzen zu einem sinnlichen
      Rausch. Jeder Klang folgt dem Rhythmus des Meeres, jede Bewegung wird Teil der Strömung. Musik wird zur Verbindung
      – intensiv, treibend und voller Gefühl. Tauche ein in das SEAQUENCE-Love Mobile und erlebe Tides Of Wonder – wo
      Wellen zu Emotionen werden, Beats durch die Tiefe tragen und die Magie des Meeres auf der Street Parade lebendig
      wird. Dominic Strike EDM, Future House, Future Pop – everything that contains melodies and chords: Dominic Strike
      has made a name for himself as a producer and DJ in the electronic dance music scene in recent years with his own
