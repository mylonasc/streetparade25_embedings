  - index: 22
    number: 24
    title: 24. Davos Nightlife (GR)
    name: Davos Nightlife (GR)
    genres: Indie House, Melodic Techno, Deep House, Tech House, Progyhouse, Afro Tech House
    motto: Alice im Bünderland
    time: 17:19 - 21:19
    description: >-
      Ein bunter Traum zwischen Bergwelt und Wunderland. Verspielt, verrückt und voller Magie – irgendwo zwischen
      Alpenromantik und Alice im Bündnerland entsteht unsere ganz eigene Welt. Farben explodieren, Realität verschwimmt
      und jede Ecke erzählt ihre eigene kleine Geschichte. Mal schrill, mal verträumt, mal komplett crazy – aber immer
      mit ganz viel Herz, Kreativität und Bündner Charme. Ein Mix aus fantasievoller Wonderland-Energie, leuchtenden
      Farben, surrealen Details und alpinem Flair. Zwischen Bergen, Karten, Uhren, Teepartys und einer Portion Wahnsinn
      feiern wir das Anderssein – laut, bunt und grenzenlos frei.
    image:
      src: https://www.streetparade.com/media/pages/love-mobiles/davos-nightlife/9095ca298a-1783084697/alice-450x.jpg
      alt: null
    artists:
      - name: DJerry
        bio: >-
          Zwischen Davos und Lenzerheide verwurzelt, bringt DJerry seit über fünf Jahren Vibes dorthin, wo sie besonders
          magisch wirken – als DJ mit einem feinen Gespür für Stimmung und Raum. Seine Sets bewegen sich zwischen
          Melodic House und Afro House, immer mit dem Ziel, eine Atmosphäre zu schaffen, in der man nicht nur tanzen,
          sondern richtig eintauchen kann.
        links:
          - type: instagram
            url: https://www.instagram.com/djerryofficial/
          - type: soundcloud
            url: https://soundcloud.com/djerryofficial
      - name: Don Agnello
        bio: >-
          DJ Don Agnello, also known as Stefano Agnello, discovered his passion for electronic music at a young age. He
          has been shaping the nightlife in Davos for many years. He has also performed at various nightclubs in Italy,
          as well as at several holiday destinations. His musical preferences include Tech House, Progressive House, and
          Minimal.
        links:
          - type: instagram
            url: https://instagram.com/djdonagnello
          - type: facebook
            url: https://facebook.com/stefanoagnello
      - name: Robin Hassler
        bio: >-
          Having grown up in snowy Davos, Robin Hassler now has over 16 years of experience as a DJ. After two years as
          an “open format DJ”, electronic club and dance music from the Slowrave, Deep/TechHouse and above all melodic
          techno genres became his great passion, which he lives and breathes to this day. In his profound sets, he
          takes his audience on a journey, always with driving and rich grooves that invite you to forget everything
          else and become one with the moment. To this day, you can always hear his weakness for epic sounds that have
          their origins in the techno/trance of the 90s. With the founding of the label Under One Groove, he and his
          team have been striving to organize various events with electronic music since 2016. His last release has
          appeared on Ante Perry’s „Be an Ape“ Records and various other releases are planned, with which you can look
          forward to melodic technoid new productions.
        links:
          - type: instagram
            url: https://instagram.com/robinhasslerdj
          - type: facebook
            url: https://facebook.com/robinhassler
          - type: soundcloud
            url: >-
              https://soundcloud.com/robinhassler?ref=clipboard&p=i&c=1&si=69898A5A253A44BAA2A1B71307712A5F&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing
      - name: Several Definitions
        bio: >-
          Ist der Name für mehrere musikalische Einflüsse. Der Schweizer Komponist und Produzent SD schafft eine Energie
          mit tiefen, melodischen Vibes, aufrichtig und lebendig. Da man sich nicht auf ein bestimmtes Genre einteilen
          lässt, variieren die Klänge seiner Musik und es gelingt, eine Reihe von Emotionen zu berühren, die zwischen
          Freude, Liebe und Nostalgie pendeln. Komplexe und impulsive Texturen verbinden sich mit verschiedenen Rhythmen
          und erzeugen lebendig, stimulieren und wirken wirkungsvoll. Eine emotionale Stimulation an der Schnittstelle
          von Raum und Zeit.
        links:
          - type: soundcloud
            url: https://soundcloud.com/several-definitions
          - type: instagram
            url: https://www.instagram.com/severaldefinitions/
      - name: Somos
        bio: >-
          SOMOS ist ein DJ- und Produzentenduo, bestehend aus Alexis (23) und Manuel (24), geboren und aufgewachsen in
          der Schweiz. Vereint durch ihre tiefe Liebe zur Musik schaffen sie kraftvolle elektronische Erlebnisse, die
          Menschen durch Klang verbinden. Alexis begann im Alter von fünf Jahren mit dem Schlagzeug zu spielen. Manuel
          begann im Alter von zehn Jahren mit der Posaune. Ihre gemeinsame Leidenschaft entwickelte sich zu DJing und
          Produktion, wobei sie elektronische Musik auf professioneller Ebene erkundete. 2026 unterschrieb SOMOS bei
          Ceamusic und begann, international in ganz Europa aufzutreten.
        links:
          - type: instagram
            url: https://www.instagram.com/somos.ch/
      - name: V.Tino
        bio: >-
          V.TINO is a DJ from Valais, Switzerland, now based in Zürich. With a genuine passion for music and melodic
          beats, he creates sets designed to evoke authentic emotions. Beginning his career also in music production,
          V.TINO shares his distinctive sound blending elements of Melodic Techno, Afro House, and House with his
          audiences.
        links:
          - type: instagram
            url: https://www.instagram.com/__v.tino__/
          - type: soundcloud
            url: https://soundcloud.com/v-tino-62186343
      - name: Zeitlos
        bio: >-
          Afro House / Tech (main)Setup:zeitlos (CH) is an emerging DJfrom Switzerland making wavesin the Afro and
          Melodic Housescene. With a deep passion forhypnotic rhythms and emotivesoundscapes, he has started togain
          recognition for his dynamicsets that seamlessly blendorganic grooves with drivingbeats. His journey from
          privateevents to club stages marks thestart of a promising artist with ahuge passion for music.
        links:
          - type: instagram
            url: https://www.instagram.com/zeitlos.ch
