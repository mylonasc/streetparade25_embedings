  - index: 20
    number: 22
    title: 22. ELEVEN11DANCE & friends (OW)
    name: ELEVEN11DANCE & friends (OW)
    genres: Techno, Afro House, Melodic Techno
    motto: Vo Fründe für Fründe
    time: 17:01 - 21:01
    description: >-
      «Vo Fründe für Fründe» ist nicht nur das Motto unseres Love Mobiles, sondern die Grundhaltung hinter allen Events
      von eleven11dance. Es prägt unsere Art zu planen, zu feiern und Menschen zusammenzubringen – heute und in Zukunft.
      «Vo Fründe für Fründe» beschreibt, wie unsere Events entstehen: aus einer grossen, gewachsenen Community von
      Freundinnen und Freunden, die elektronische Musik gemeinsam feiern und weitertragen. Bei uns sind alle willkommen.
      Unser Love Mobile ist kein exklusiver Club, sondern ein Ort, an dem Menschen zusammenkommen, tanzen und sich auf
      Augenhöhe begegnen. Respekt, gute Stimmung und ein achtsames Miteinander stehen im Vordergrund. Unsere Zielgruppe
      sind Menschen zwischen 25 und 40 Jahren, die Qualität schätzen, Verantwortung übernehmen und Lust auf ein
      positives, verbindendes Event haben. „vo Fründe für Fründe“ ist unser Versprechen: ein Love Mobile von Menschen,
      die feiern wollen – für Menschen, die feiern wollen.
    image:
      src: >-
        https://www.streetparade.com/media/pages/love-mobiles/eleven11dance-friends/c3b5b0d6f8-1780989840/bildschirmfoto-2026-06-09-um-09.23.25-450x.png
      alt: null
    artists:
      - name: Flo le Fortis
        bio: >-
          Mit über zehn Jahren Erfahrung hat sich Flo le Fortis als feste Größe der elektronischen Szenein der
          Zentralschweiz etabliert. Sein markanter Sound zwischen Afro und Melodic Housekombiniert treibende Rhythmen,
          melodische Tiefe und atmosphärische Vocals zu einemmodernen Underground-Sound mit emotionaler Wucht. Eine
          tiefe Freundschaft zu Elevendancebegleitet seinen künstlerischen Weg seit Beginn an!
        links:
          - type: instagram
            url: https://www.instagram.com/flolefortis/
          - type: soundcloud
            url: https://soundcloud.com/flo-le-fortis
      - name: NoNo & Maui
        bio: >-
          NoNo & Maui sind ein DJ-Duo aus der Zentralschweiz, das seit 2013 gemeinsam auflegt. Verbunden durch eine enge
          Freundschaft, spiegelt sich ihre Energie in jedem Auftritt wider. Mit feinem Gespür für die Crowd schaffen sie
          mitreissende Sets, die Emotionen wecken und Menschen verbinden. Ob Club oder Festival – ihre Musik sorgt für
          unvergessliche Momente und lässt das Publikum den Augenblick intensiv erleben.
        links:
          - type: instagram
            url: https://www.instagram.com/nonomaui/
          - type: soundcloud
            url: https://soundcloud.com/nonomaui
      - name: Oio
        bio: >-
          oioioi, hier scheppert’s! Mit bounce Basslines und verspielten Melodien lädt oio dich zum Tanzen ein. Egal ob
          tagsüber mit Disco-Einfluss oder nachts mit purer Bass-Massage – oio holt dich garantiert ab. Lass dich gehen
          und tanze, wie du willst, denn hier sollen sich alle frei und federleicht fühlen.
        links: []
      - name: Pretty Pink
        bio: >-
          Mit ihrer Leidenschaft für Melodic, Techno sowie Progressive House hat sie sich weltweit einen Namen gemacht
          und bespielte Festivals wie Tomorrowland, EDC Las Vegas, Lollapalooza, Ultra Music Festival und Parookaville.
          Mit Ihre Radioshow „DEEP WOODS“ (über eine Million Streams), zwei eigenen Labels & laufenden internationalen
          Tourneen befindet sich Pretty Pinks Karriere weiterhin auf Erfolgskurs.
        links:
          - type: soundcloud
            url: https://soundcloud.com/prettypink
          - type: instagram
            url: https://www.instagram.com/prettypinkmusic
          - type: website
            url: https://prettypink.de/
          - type: facebook
            url: https://www.facebook.com/prettypinkmusic
      - name: Vanita
        bio: >-
          DJ Vanita (Vanessa Spolidoro) aus Zürich mit italienischen Wurzeln zählt zu den spannendsten Acts der
          elektronischen Szene. Seit 2009 begeistert sie mit energiegeladenem House & Techno. Durchbruch mit Residency
          im Hive Club und Releases auf Labels wie Katermukke. Internationale Gigs von Europa bis USA, Thailand &
          Südafrika. Ein Name, den man im Auge behalten muss.
        links:
          - type: soundcloud
            url: https://soundcloud.com/vanita
          - type: instagram
            url: https://www.instagram.com/vanita_music
          - type: facebook
            url: https://www.facebook.com/djvanita?fref=ts
