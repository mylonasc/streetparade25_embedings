    popup_scroll_text: >-
      22. ELEVEN11DANCE & friends (OW) 17:01 - 21:01 «Vo Fründe für Fründe» ist nicht nur das Motto unseres Love
      Mobiles, sondern die Grundhaltung hinter allen Events von eleven11dance. Es prägt unsere Art zu planen, zu feiern
      und Menschen zusammenzubringen – heute und in Zukunft. «Vo Fründe für Fründe» beschreibt, wie unsere Events
      entstehen: aus einer grossen, gewachsenen Community von Freundinnen und Freunden, die elektronische Musik
      gemeinsam feiern und weitertragen. Bei uns sind alle willkommen. Unser Love Mobile ist kein exklusiver Club,
      sondern ein Ort, an dem Menschen zusammenkommen, tanzen und sich auf Augenhöhe begegnen. Respekt, gute Stimmung
      und ein achtsames Miteinander stehen im Vordergrund. Unsere Zielgruppe sind Menschen zwischen 25 und 40 Jahren,
      die Qualität schätzen, Verantwortung übernehmen und Lust auf ein positives, verbindendes Event haben. „vo Fründe
      für Fründe“ ist unser Versprechen: ein Love Mobile von Menschen, die feiern wollen – für Menschen, die feiern
      wollen. Flo le Fortis Mit über zehn Jahren Erfahrung hat sich Flo le Fortis als feste Größe der elektronischen
      Szenein der Zentralschweiz etabliert. Sein markanter Sound zwischen Afro und Melodic Housekombiniert treibende
      Rhythmen, melodische Tiefe und atmosphärische Vocals zu einemmodernen Underground-Sound mit emotionaler Wucht.
      Eine tiefe Freundschaft zu Elevendancebegleitet seinen künstlerischen Weg seit Beginn an! NoNo & Maui NoNo & Maui
      sind ein DJ-Duo aus der Zentralschweiz, das seit 2013 gemeinsam auflegt. Verbunden durch eine enge Freundschaft,
      spiegelt sich ihre Energie in jedem Auftritt wider. Mit feinem Gespür für die Crowd schaffen sie mitreissende
      Sets, die Emotionen wecken und Menschen verbinden. Ob Club oder Festival – ihre Musik sorgt für unvergessliche
      Momente und lässt das Publikum den Augenblick intensiv erleben. Oio oioioi, hier scheppert’s! Mit bounce Basslines
      und verspielten Melodien lädt oio dich zum Tanzen ein. Egal ob tagsüber mit Disco-Einfluss oder nachts mit purer
      Bass-Massage – oio holt dich garantiert ab. Lass dich gehen und tanze, wie du willst, denn hier sollen sich alle
      frei und federleicht fühlen. Pretty Pink Mit ihrer Leidenschaft für Melodic, Techno sowie Progressive House hat
      sie sich weltweit einen Namen gemacht und bespielte Festivals wie Tomorrowland, EDC Las Vegas, Lollapalooza, Ultra
      Music Festival und Parookaville. Mit Ihre Radioshow „DEEP WOODS“ (über eine Million Streams), zwei eigenen Labels
      & laufenden internationalen Tourneen befindet sich Pretty Pinks Karriere weiterhin auf Erfolgskurs. Vanita DJ
      Vanita (Vanessa Spolidoro) aus Zürich mit italienischen Wurzeln zählt zu den spannendsten Acts der elektronischen
      Szene. Seit 2009 begeistert sie mit energiegeladenem House & Techno. Durchbruch mit Residency im Hive Club und
      Releases auf Labels wie Katermukke. Internationale Gigs von Europa bis USA, Thailand & Südafrika. Ein Name, den
      man im Auge behalten muss.
  - index: 21
    number: 23
    title: 23. Animalz x G-Town Production (SO)
    name: Animalz x G-Town Production (SO)
    genres: Remember Trance, Uplifting Trance
    motto: Beats Of Colors
    time: 17:10 - 21:10
    description: >-
      ANIMALZ ist ein engagiertes Team mit einer klaren Vision: Wir gestalten und realisieren kulturelle und
      musikalische Projekte, die Menschen zusammenbringen und die Event- und Musikkultur aktiv mitprägen. Unser Fokus
      liegt auf der Organisation eigener Veranstaltungen sowie der Teilnahme an etablierten Events wie der Street
      Parade. Gleichzeitig setzen wir uns dafür ein, Nachwuchstalente zu fördern und kreativen Ideen eine Plattform zu
      geben. Darüber hinaus unterstützen wir Projekte im Bereich Kunst, Musik und Kultur, die einen sozialen Mehrwert
      schaffen und die Szene nachhaltig bereichern. Für Kooperationen, gemeinsame Projekte oder Unterstützung bei der
      Umsetzung von Events stehen wir jederzeit offen – wir freuen uns über den Austausch und neue Partnerschaften.
      Erlebe die Street Parade aus der besten Perspektive! Unser Chamäleon-Motto verspricht eine unvergessliche Party
      auf Rädern durch Zürich.
    image:
      src: >-
        https://www.streetparade.com/media/pages/love-mobiles/animalz-g-town-production/72988aec68-1783083965/animalz-450x.jpg
      alt: null
    artists:
      - name: Andrew Larave
        bio: >-
          Andrew Larave ist ein Schweizer Trance-DJ der neuen Generation undTeil der aktuellen Remember- und
          Uplifting-Trance-Szene. Er tritt bei Trance-Classics-Events,Clubnächten und Street-Parade-Events auf und teilt
          sich Line-ups mit Künstlern wie Barthezz,Mind-X, Patrick Ravn, DJ Synergee und DJ Doom.
        links:
          - type: instagram
            url: https://www.instagram.com/andrew.larave
          - type: facebook
            url: https://www.facebook.com/groups/andrewlarave
      - name: Barthezz
        bio: >-
          Barthezz ist einniederländischer DJ und Produzent. Er erlangte weltweite Bekanntheit in der Trance-
          undDance-Szene durch seinen Mega-Hit "On The Move" aus dem Jahr 2001
        links:
          - type: soundcloud
            url: https://soundcloud.com/bartclaessen
          - type: instagram
            url: https://www.instagram.com/barthezzofficial?igsh=ZmFuZ3k5NndjNDA%3D
          - type: facebook
            url: https://www.facebook.com/p/Barthez-100065192040798/
      - name: DOOM
        bio: >-
          DJ Doom is a historic icon in the Ticino Trance Remember music scene. Founder of Historia, the concept leader
          dedicated to Trance Classics in Ticino, DJ Doom regularly performs at Alcatraz in Riazzino and at Vanilla,
          giving each performance a unique and unmistakable energy. His recent appearances at Winterland and La Rotonda
          del Festival of Locarno have further consolidated his role, bringing Trance to the squares of Ticino and
          definitively consecrating this musical style in the local culture.
        links:
          - type: instagram
            url: https://www.instagram.com/mischa.enjoy.djdoom/?igsh=MzJwYzhobGdmM3Zr#
          - type: facebook
            url: https://www.facebook.com/djdoom
      - name: ICØN
        bio: >-
          ICØN ist ein DJ aus der Region St. Gallen, der seit 2022 seine Leidenschaft für elektronische Musikhinter den
          Decks auslebt. Sein Sound bewegt sich zwischen House, Melodic Techno und EDM undzeichnet sich durch
          energiegeladene Sets sowie ein feines Gespür für die Crowd aus.Zu seinen bisherigen Highlights zählen
          Auftritte für Shape Events (heute Seaquence) sowie seineTätigkeit als Resident DJ für Vivaare, einen
          Veranstalter aus Solothurn. Mit seinem vielseitigen Stilund seiner wachsenden Erfahrung sorgt ICON für
          unvergessliche Momente auf der Tanzfläche.
        links:
          - type: soundcloud
            url: >-
              https://soundcloud.com/achmed-halai?ref=clipboard&p=i&c=1&si=165104CA17054E9CA2F878C8A0E7A24D&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing
          - type: instagram
            url: https://www.instagram.com/officialdjicon_?igsh=MWF3b2pxZmFmMzJtZw%3D%3D&utm_source=qr
      - name: Mind-X
        bio: >-
          DJ Mind-X ist einer der bekanntesten Schweizer Trance-DJs und Produzenten. Er stammt aus Bern und gehört zu
          den Pionieren der Schweizer Trance- und Techno-Szene. Bereits Anfang der 1990er machte er sich einen Namen und
          wurde mehrfach zumbeliebtesten DJ der Schweiz gewählt.
        links:
          - type: instagram
            url: https://www.instagram.com/djmindx
          - type: facebook
            url: https://www.facebook.com/p/DJ-Mind-X-100056872401276/
          - type: soundcloud
            url: https://soundcloud.com/mind-x
      - name: Patrick Ravn
        bio: >-
          Patrick Ravn, auch bekannt als Patrick Rupp oder Hardstyle Rockerz, ist ein Schweizer DJ undProduzent mit
          musikalischen Wurzeln in der Trance- und Dance-Szene der 2000er-Jahre. SeinFokus liegt auf Trance, Uplifting
          Trance, Hard Trance und modernen Produktionen mit klassischenEinflüssen. Er verbindet den Sound der goldenen
          Trance-Ära mit aktuellen elektronischenElementen. Seine Alias sind Hardstyle Rockerz und Malawi.
        links:
          - type: instagram
            url: https://www.instagram.com/patrickravnofficial
          - type: youtube
            url: https://www.youtube.com/@patrickravn
          - type: facebook
            url: https://www.facebook.com/profile.php?id=100094375019956
          - type: website
            url: https://sector-beatz.com/
      - name: SYNERGEE
        bio: >-
          DJ Synergee ist ein Schweizer Trance-DJ aus dem Tessin und gehört zu den bekannten Namen derdamaligen Trance-
          und Clubszene rund um den legendären Club Alcatraz in Riazzino. Sein Name istbesonders mit der
          Trance-Remember-Zeit von etwa 1998–2004 verbunden. Er spielte überJahrzehnte in Clubs, auf Events und
          Trance-Classics-Partys in der Schweiz und Italien.
        links:
          - type: soundcloud
            url: https://soundcloud.com/marco-synergee-codoni
          - type: instagram
            url: https://www.instagram.com/dj_synergee/
          - type: facebook
            url: https://www.facebook.com/DjSynergee
