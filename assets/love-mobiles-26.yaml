  - index: 16
    number: 18
    title: 18. Akt Family - Vo Züri für Züri
    name: Akt Family - Vo Züri für Züri
    genres: House, Techno, Techhouse
    motto: Heaven of Love
    time: 16:25 - 20:25
    description: >-
      Wir freuen uns einmal mehr ein Teil der Street Parade 2025 zu sein, an der wir bereits 1994 mit unserem 1. Love
      Mobile teilgenommen haben! Wir fiebern diesem Tag schon jetzt entgegen und können es kaum erwarten das Zürcher
      Seebecken an diesem Tag zu begeistern. Auf unserem Love Mobile erwarten dich coole Drinks und perfekte House Musik
      um den ganzen Tag abzutanzen UND, wie in guter alter AKT-Manier, eine Stimmung der Extraklasse! Dieses Jahr steht
      unser Love Mobile unter dem Motto «Heaven of Love». Mit dem Dresscode Blau und Weiss und dem Accessoire Gold
      heizen wir der Partymeute so richtig ein. Mit zwei Bars, zwei Toiletten, einem zentralen DJ-Pult und dem Besten,
      was die House-Musik zu bieten hat, bleiben keine Wünsche offen!
    image:
      src: >-
        https://www.streetparade.com/media/pages/love-mobiles/akt-family-vo-zueri-fuer-zueri/f5ff4d5803-1780574253/672166467_1735306711065823_1788110420054468763_n-450x.jpg
      alt: null
    artists:
      - name: Rolf Imhof
        bio: >-
          Seine sympathische Art und sein geniales Gespür für die Crowd machen Rolf Imhof zu einem der begehrtesten DJs
          Zürichs. Über Jahrzehnte hat er sich als feste Grösse für exklusive Events etabliert – von lokalen Hotspots
          bis ins legendäre Pacha Ibiza. Als Resident auf dem Akt Family Love Mobile verkörpert er den Sound von «Vo
          Züri für Züri». Wenn Rolf die Regler übernimmt, verwandelt sich das Seebecken in eine bebende Tanzfläche. Ein
          Garant für pure Street-Parade-Ekstase!
        links:
          - type: instagram
            url: https://www.instagram.com/rolf.imhof/
          - type: website
            url: https://rolfimhof.ch/
          - type: facebook
            url: https://www.facebook.com/rolf.imhof/
      - name: Sam Madi
        bio: >-
          DJ, Produzent und absoluter Publikumsliebling: Sam Madi prägt die Schweizer Musikszene seit Jahren. Neben
          seiner technischen Begabung ist es vor allem seine mitreissende Ausstrahlung, die jede Crowd fesselt. Als
          Herzstück auf dem Akt Family Love Mobile «Vo Züri für Züri» sorgt er an der Street Parade für den perfekten
          Soundtrack. Ein Act, der mit treibenden Beats und echtem Zürcher Herzblut das Seebecken komplett zum Kochen
          bringt.
        links:
          - type: instagram
            url: https://www.instagram.com/sammadimusic
          - type: website
            url: https://www.sammadi.com/
          - type: soundcloud
            url: https://soundcloud.com/sammadi
          - type: youtube
            url: https://www.youtube.com/sammadi?skip_registered_account_check=true
      - name: Sendrix
        bio: >-
          Funky, groovy und immer einen soliden Bass. Seit Beginn an steht DJ Sendrix auf elektronische Musik. Egal ob
          in seiner Residenz am schönen Zugersee oder in der ganzen Schweiz auf Tour, er bringt mit seiner musikalischen
          Erfahrung die Menschen zum Tanzen. Gute Vibes, groovige House Music und viele lachende Gesichter. Das sind die
          besten Partys. Nach seinem erfolgreichen Street Parade-Debüt 2022 in Zürich, begeistert er das Akt Family Love
          Mobile «Vo Züri für Züri» nun schon zum vierten Mal.
        links:
          - type: instagram
            url: https://www.instagram.com/djsendrix/
          - type: website
            url: >-
              https://ruvahouse.lnk.to/TheSolution?fbclid=PAZXh0bgNhZW0CMTEAAadCQ3HYpyB-Mc0VWH39d65ftoKNgCLmrx_ajA4GZLy7TpFttGz5KhWFcRpQpw_aem_O9sWiUAzOeoDIfpsS1MkJg
    links:
