  - index: 24
    number: 26
    title: 26. Magic MaRoNi x Labil mit Stil (TG/ZH)
    name: Magic MaRoNi x Labil mit Stil (TG/ZH)
    genres: Techno, Psy-Trance
    motto: Electric Circus
    time: 17:37 - 21:37
    description: >-
      Unter dem Motto «Electric Circus» zeigt sich unser Love Mobile in elegantem Schwarz-Weiß — klare Linien und
      kontrastreiche Flächen bilden die Bühne für ein visuell kraftvolles Gesamterlebnis. Die Gäste treten in Neonfarben
      und Schwarz auf, wodurch ein spannungsreicher Mix aus urbanem Chic und pulsierender Festivalenergie entsteht. Die
      Dekoration setzt auf Glamour: Spiegelkugeln an der Decke, funkelnder Glitzer und gezielte Lichtakzente erzeugen
      schillernde Reflexionen und eine verführerische Zirkusatmosphäre. Zusammen entsteht ein immersives, stilvolles und
      zugleich verspieltes Setting, das Bass, Bewegung und visuelle Eindrücke zu einem unvergesslichen Erlebnis
      verschmelzen lässt.
    image:
      src: >-
        https://www.streetparade.com/media/pages/love-mobiles/magic-maroni-x-labil-mit-stil-zh-tg/758b20bd63-1780906836/bildschirmfoto-2026-06-08-um-10.20.05-450x.png
      alt: null
    artists:
      - name: Alanor
        bio: >-
          Alanor ist ein aufstrebender DJ aus Zürich, bekannt für seine fesselnden Techno Sets. AlsMitglied des Labels
          «Labil mit Stil» hat er sich in der lokalen Musikszene etabliert. Seineenergiegeladenen und atmosphärischen
          Auftritte in renommierten Clubs wie Hive, Schneidereiund Wunderbox haben ihm eine treue Fangemeinde
          eingebracht.
        links:
          - type: instagram
            url: https://www.instagram.com/djalanor
          - type: soundcloud
            url: https://soundcloud.com/djalanor
          - type: website
            url: https://labilmitstil.ch/
      - name: Baba Ganouj
        bio: >-
          Ganz im Gegensatz zu seinem kulinarischen Namensvetter kommen seine Sets mit ordentlichPfeffer, sodass es auch
          in der letzten Nase auf dem Dancefloor kitzelt. Zu hören gibt es vomihm über Afro House, Tech House, Indie,
          Techno alles bis hin zu Psytrance. Grösstenteils undbevorzugt schwingt er aber melodischen und orientalischen
          Techno sowie Progressive Houseauf die Teller.Seit über 6 Jahren wandelt Baba Ganouj nun regelmässig hinter den
          Turntables im ZürcherNachtleben herum. Bereits vor Jahrzehnten zog ihn die elektronische Musik in ihren
          Bann,wobei er stehts bemüht ist das Publikum, sowohl hinter als auch vor den Decks mit seinerLeidenschaft und
          seinem Enthusiasmus zu verzaubern.
        links:
          - type: instagram
            url: https://www.instagram.com/baba_ganouj/
          - type: soundcloud
            url: https://soundcloud.com/baba_ganouj
          - type: website
            url: https://labilmitstil.ch/
      - name: Der Köhler
        bio: >-
          Der Köhler ist ein Techno-DJ aus Zürich, der für seine energiegeladenen Sets und seine Rolleals Mitgründer des
          Kollektivs Labil mit Stil bekannt ist. Sein Sound bewegt sich zwischenhypnotischem Melodic und treibendem Dark
          Techno. Als Resident-DJ von Labil mit Stil ist erregelmässig im Hive Club Zürich, auf Festivals und bei
          weiteren Events zu erleben. Einbesonderes Highlight ist der Auftritt auf dem Labil mit Stil Lovemobile an der
          Street Parade.Seine neuesten Mixe und Live-Sets sind auf SoundCloud zu finden.
        links:
          - type: instagram
            url: https://www.instagram.com/der__koehler/
          - type: website
            url: https://labilmitstil.ch/
          - type: soundcloud
            url: https://soundcloud.com/der_koehler
      - name: IBOR
        bio: >-
          IBOR developed a passion for electronic music at a young age through the Zurich club scene. In 2005, his
          fascination with trance led him to learn how to DJ with vinyl and later with digital tracks, to found his own
          event label, “Firedance,” and to build “Firedance Lovemobiles” for Zurich’s famous Street Parade. Later,
          Robert’s musical focus shifted toward psy-trance, where he feels most at home today.
        links:
          - type: instagram
            url: https://www.instagram.com/ibor_producing/
          - type: website
            url: https://labilmitstil.ch/
          - type: soundcloud
            url: https://soundcloud.com/robert-engel-243948526
      - name: Nickster
        bio: >-
          What sets Nickster apart is that he knows exactly what the audience likes. He knows how to get the crowd going
          and make the dance floor shake. From techno to psytrance, he gets the crowd dancing with his unique sound and
          tireless energy.
        links:
          - type: instagram
            url: https://www.instagram.com/nicire
          - type: soundcloud
            url: https://soundcloud.com/nicolas-reiff
          - type: website
            url: https://labilmitstil.ch/
      - name: Tanner
        bio: >-
          Marco hatte schon immer eine Vorliebe zur Musik. Er entdeckte das Mixen gegen Ende der90er Jahre und hatte
          seine ersten Auftritte im Firehouse in Weinfelden, wie auch an derMainstation in Zürich ab dem Jahr 2000.Es
          folgten viele weitere Sets an diversen Trancepartys sowie Lovemobiles an der Streetparade.Bis heute hat die
          elektronische Musik einen sehr grossen Stellenwert in seinem Leben – obwohlseit einigen Jahren das Mixen und
          Auflegen nebst seinem Beruf hauptsächlich als Insel derEntspannung und Hobby dient.Anfangs begeistert für
          Trance Musik hat sich sein Horizont im Laufe der Jahre erweitert. Vonmelodiösem Techno, Trance oder Psytrance,
          spielt Marco je nach Situation und Geschmackharmonische und melodiöse Sets, die ein hohes Level an Energie
          mitbringen. Aufseiner Soundcloud Page lässt sich die musikalische Vielfalt und die Entwicklung seines
          Stilsüber die letzten 15 Jahre verfolgen und anhören.Er ist immer wieder für eine Überraschung gut und ein
          sicherer Wert, wenn es darum geht, diePartygäste aus ihrer Reserve zu locken.
        links:
          - type: instagram
            url: https://www.instagram.com/marco.tanner/
          - type: facebook
            url: https://www.facebook.com/djscare1
          - type: soundcloud
            url: https://soundcloud.com/djscare-1
          - type: website
            url: https://labilmitstil.ch/
    links:
