      veröffentlichte Tracks auf mehreren Labels.
  - index: 18
    number: 20
    title: 20. JUR Records (AG)
    name: JUR Records (AG)
    genres: Drum and Bass
    motto: 35 Years JUR Records
    time: 16:43 - 20:43
    description: >-
      Seit 1991 steht JUR Records für Drum and Bass in der Schweiz und bringt mit Events wie VIP Session, Therapy
      Session, Return to the Bassline, Club Hardware und BASS fette Vibes nach Aarau, Luzern und Zürich. Tiefe Bässe,
      treibende Beats und echter Oldschool-Spirit sind unser Fundament. Die Zusammenarbeit mit der Schweizer Szene ist
      zentral, genauso wie die Förderung von Newcomer-DJs, die bei uns eine Bühne bekommen. Seit 35 Jahren bleiben wir
      dem Sound treu und bringen die Crowd in Bewegung. 2026 feiern wir 35 Jahre JUR Records, sind zum achten Mal an der
      Street Parade dabei und bringen Zürich zum Beben.
    image:
      src: >-
        https://www.streetparade.com/media/pages/love-mobiles/jur-records-ag/10e9b839f1-1780995400/bildschirmfoto-2026-06-09-um-10.56.21-450x.png
      alt: null
    artists:
      - name: Agent C
        bio: >-
          Cerni aka Agent C kam durch seinen Freund Renato zur Drum and Bass Szene und war neben Techno bald regelmässig
          an Events wie im Rohstofflager Zürich anzutreffen. Sein Sound ist vielseitig: von harten Neuro-Beats bis zu
          weichen Liquid-Tunes spielt er fast alle Subgenres – ausser Jump Up. Statt festen Favoriten lässt er sich
          immer wieder von neuen Künstlern und Labels inspirieren.
        links:
          - type: instagram
            url: https://www.instagram.com/cerni_agent_c
          - type: website
            url: https://www.jurrecords.ch/
      - name: Darius D
        bio: >-
          Darius D passt seine Sets flexibel an die Crowd an und baut auf deren Stimmung auf. Seine Drum and Bass Sets
          mischt er oft mit Dubstep, Trap und Hardwave. Er experimentiert gerne und sorgt für energiegeladene,
          kraftvolle Vibes. Dabei ist ihm wichtig, dass sich die Musik ständig weiterentwickelt und nicht stehen bleibt.
        links:
          - type: instagram
            url: https://www.instagram.com/demiandarius
          - type: website
            url: https://www.jurrecords.ch/
          - type: soundcloud
            url: https://soundcloud.com/darius-d
      - name: Du Lait
        bio: >-
          Du Lait gehört zur 1. Generation Schweizer DnB-DJs. Mitte 90er veranstaltete er eigene Events, meist illegal
          im öffentlichen Raum. Ferner spielte er regelmäßig in Clubs wie Hive, Rohstofflager, Supermarket und
          Dachkantine sowie auf Festivals wie Streetparade, Lethargy und Goliath. 1999 startete er mit DJ Steel aus NYC
          die bis heute laufende Sendung BPM auf Radio LoRa. Er versteht es meisterhaft mit der Crowd auf der Tanzfläche
          zu interagieren – und sorgt so für garantiert ekstatische Momente.
        links:
          - type: instagram
            url: https://www.instagram.com/djdulait
          - type: facebook
            url: https://www.facebook.com/realdulait
          - type: soundcloud
            url: https://soundcloud.com/du_lait
      - name: Frog U
        bio: >-
          Frog U verfolgt keinen festen Stil: Er kombiniert Gegensätze wie jazzige Tunes und Neurofunk und schafft so
          eigene, vielseitige Sets. Er liebt es, Tracks aktiv zu lesen und technisch auszureizen. Drum and Bass dient
          ihm als Basis, um widersprüchliche Subgenres zu verbinden – von Liquid bis Neurofunk. Auch genreübergreifend
          ist er unterwegs und sorgt so für abwechslungsreiche, dynamische Sets.
        links:
          - type: instagram
            url: https://www.instagram.com/frog_u_
          - type: soundcloud
            url: https://soundcloud.com/frog_u
          - type: website
            url: https://www.jurrecords.ch/
      - name: Infernal Bastard
        bio: >-
          Tinu machte 2006/07 mit Quad Damage seine ersten DJ-Schritte, später folgten Studio und erste Produktionen.
          Sein Fokus liegt auf Darkstep, Techstep bis Crossbreed – geprägt von harten Bässen und schnellen Drums.
          Inspiriert wird er von Acts wie Dom & Roland, Ed Rush & Optical, Technical Itch und Limewax.
        links:
          - type: facebook
            url: https://www.facebook.com/InfernalBastard
          - type: website
            url: https://www.jurrecords.ch/
      - name: Mad B
        bio: >-
          Mad B aus Zürich ist einer der wegweisenden DJs der Schweiz und blickt auf eine mehr als 38-jährige Karriere
          zurück. Er begann Ende der 1980er Jahre mit Acid House, wandte sich Anfang der 1990er Jahre dem Breakbeat zu
          und prägte bis Mitte der 2000er Jahre als einer der Urgesteine der Schweizer Szene die Jungle- und
          Drum-and-Bass-Szene.Wir freuen uns sehr, diesen legendären Schweizer DJ präsentieren zu dürfen.
        links:
          - type: instagram
            url: https://www.instagram.com/djmadb
          - type: soundcloud
            url: https://soundcloud.com/mad_b
          - type: facebook
            url: https://www.facebook.com/martin.buehrer
      - name: Semtex
        bio: >-
          Sasha aka Semtex entdeckte mit 16 in London bei Nicky Blackmarket Drum and Bass und brachte den Sound in die
          Schweiz. Er wurde DJ, gründete JUR Records und fördert seither Nachwuchstalente. 1997 organisierte er die
          erste Drum and Bass Party in Zürich. Neben Auftritten führt er einen Plattenladen und spielt vielseitige Sets
          – ausschliesslich auf Vinyl.
        links:
          - type: instagram
            url: https://www.instagram.com/semtex_jurrecords
          - type: website
            url: https://www.jurrecords.ch/
          - type: facebook
            url: https://www.facebook.com/p/Semtex-JUR-Records-100040406419323/
      - name: SNES
        bio: >-
          Ob Liquid Tunes an einem Sommerabend oder knüppelharten Neurofunk morgens um 5: SNES kann alles und noch viel
          mehr. Er spürt, was das Publikum will, und kann ihm geben, was es will. So vielseitig und souverän er jeden
          Dancefloor im Griff hat, wird SNES auch gerne gebucht und ist immer wieder bei anderen Crews zu Gast und auf
          Parties anzutreffen. SNES zählt zu den Mitgründern von Local Bass Movement aus St. Gallen und ist heute die
          treibende Kraft.
        links:
          - type: instagram
            url: https://www.instagram.com/snesdnb
          - type: website
            url: https://localbassmovement.ch/
      - name: Z-Groove
        bio: >-
          Z-Groove sammelte in den 90ern erste DJ-Erfahrungen mit Techno, Trance und Detroit. Am Motion Festival 1997
          entdeckte er Drum and Bass. 2008 kam er über ein Konzert von Jojo Meier und DJ Muck mit JUR Records in
          Kontakt. Sein Stil lebt von Bass und Groove mit sphärischen Elementen – entscheidend ist für ihn nicht der
          Name, sondern dass der Track überzeugt.
        links:
          - type: instagram
            url: https://www.instagram.com/z_groove
          - type: website
            url: https://www.jurrecords.ch/
      - name: ‘nade
        bio: >-
          ’nade wuchs mit elektronischer Musik auf – von Trance und Happy Hardcore bis Techno. Anfang der 2000er
          entdeckte sie über Ragga/Jungle den Drum and Bass und entwickelte ihren eigenen Sound. Seit den frühen 2010ern
          ist sie in der Szene aktiv und seit 10 Jahren Teil von JUR Records. Sie spielte in verschiedenen Clubs in der
          Schweiz sowie auch in Brisbane (AUS). Ihre energiegeladenen Sets nehmen die Crowd mit auf eine Reise durch
          alle Subgenres.
        links:
          - type: instagram
            url: https://www.instagram.com/nade____
          - type: facebook
            url: https://www.facebook.com/nadednb
          - type: soundcloud
            url: https://soundcloud.com/nadednb
          - type: website
            url: https://www.jurrecords.ch/
