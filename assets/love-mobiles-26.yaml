  - index: 13
    number: 14
    title: 14. Roda Studios (ZG)
    name: Roda Studios (ZG)
    genres: Techno, Tech House, Peak Time Techno
    motto: Medusa – The Curse Of Beauty
    time: 15:49 - 19:49
    description: >-
      Betritt einen fahrenden griechischen Tempel, in dem Schönheit zur Versuchung und Gefahr zugleich wird. Medusa
      steht im Zentrum – kraftvoll, faszinierend, unentrinnbar. Zwischen mächtigen Säulen, fliessenden weissen und
      beigen Vorhängen, goldenen Ornamenten und unzähligen Spiegeln verschwimmen Mythos und Realität. Doch Vorsicht: Wer
      sich nur von der äusseren Schönheit blenden lässt, riskiert, das Wesentliche zu verlieren. Roda Studios bringt
      2026 ein kompromisslos starkes Line-up auf die Strasse – international gefeierte Artists, treibender Sound und
      pure Eskalation mitten im Herz der Street Parade. Dresscode: Weiss / Beigem, Accessoires: Gold, braunes Leder.
