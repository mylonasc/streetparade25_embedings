  - index: 2
    number: 2
    title: 2. SYNERGY (VD/ZH)
    name: SYNERGY (VD/ZH)
    genres: Trance, Progressive
    motto: Trance Paradise
    time: 14:08 - 18:08
    description: >-
      Twelve editions in, SYNERGY Events brings its Love Mobile back to the Street Parade, this year under the theme
      Trance Paradise. A 100% trance float at the heart of the world's biggest electronic music gathering in Zurich.
      Headlining the float are two international names: Daxson (UK), widely recognized for his repeated appearances at
      Transmission festival and the anthems he created for it, and Ørjan Nilsen (Norway), a long-standing pillar of the
      trance scene and a familiar face of A State Of Trance. Alongside them, Madwave, a key figure of the Swiss trance
      scene and the embodiment of the SYNERGY spirit, WeNyx, a rising Swiss talent with a sharp, heartfelt sound and a
      drive that makes her impossible to ignore, and Heliom (aka Höhnflug), a faithful presence in the Swiss community
      whose energy has been part of the SYNERGY story for years. The celebration continues at the traditional After
      Parade Party at Alte Kaserne, Zurich.
    image:
      src: https://www.streetparade.com/media/pages/love-mobiles/synergy-vd-zh/5b3d13910d-1783407939/synergy-450x.jpg
      alt: null
    artists:
      - name: Daxson
        bio: >-
          UK producer and Coldharbour Recordings artist Daxson has become one of trance's most in-demand names through a
          four-year run as the official anthem creator for Transmission festival. From Behind the Mask in 2022 to The
          Temple of Time in 2025, each track has defined the sonic identity of one of the world's biggest trance
          gatherings. Beyond Transmission, he has performed at Dreamstate, Creamfields, UNTOLD and Luminosity, building
          a reputation for sets that are both technically sharp and emotionally powerful.
        links:
          - type: soundcloud
            url: https://soundcloud.com/daxsonmusic
          - type: facebook
            url: https://www.facebook.com/DaxsonMusic
          - type: instagram
            url: https://www.instagram.com/daxsonmusic
          - type: tiktok
            url: https://www.tiktok.com/@daxsonmusic
      - name: Heliom
        bio: >-
          Heliom (alias Höhnflug) is a Zurich-based DJ and producer whose connection to electronic music goes back to
          the early 90s. A recurring presence at the Street Parade and Lake Parade, he has also performed at some of
          Switzerland's most iconic clubs, including OXA, MAD Club and D! Club. His productions, shaped by classical
          roots and a sharp sense of atmosphere, have landed on Black Hole Recordings and the official Street Parade
          Warm-Up Compilation, with the track Summit reaching Beatport's Top 100.
        links:
          - type: tiktok
            url: https://www.tiktok.com/@heliommusic
          - type: instagram
            url: https://www.instagram.com/heliommusic
          - type: soundcloud
            url: https://soundcloud.com/heliommusic?utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing
      - name: Madwave
        bio: >-
          Madwave is one of the most enduring figures of Swiss trance, with a Street Parade presence stretching back to
          the early 2000s.Madwave is one of the most enduring figures of Swiss trance, with a Street Parade presence
          stretching back to the early 2000s. Among the Swiss artists who travel best, he has built a solid
          international reputation with releases on Armada Music, Vandit and Future Sound of Egypt, and appearances at
          UNTOLD, Luminosity Beach and Nature One. He also mixed three official Street Parade compilations. 2026 has
          been his busiest year on the road yet, with barely a weekend off the decks.
        links:
          - type: facebook
            url: https://www.facebook.com/madwave
          - type: instagram
            url: https://www.instagram.com/madwave
          - type: soundcloud
            url: https://www.soundcloud.com/madwave
          - type: tiktok
            url: https://www.tiktok.com/@madwave
          - type: youtube
            url: https://www.youtube.com/djmadwave
          - type: website
            url: https://www.madwave.net/
      - name: WeNyx
        bio: >-
          Czech-born and Switzerland-based, WeNyx has been a growing presence in the Swiss club and festival scene since
          she started DJing in 2021. Her sound merges the dark intensity of techno with the euphoric drive of trance,
          delivered with a stage presence that leaves little room for standing still. She has performed at Street
          Parade, Euphoria Weekender in Malta and Short Circuit Festival, and is making her first appearance on the
          SYNERGY Love Mobile this August.
        links:
          - type: website
            url: https://wenyx.ch/
          - type: instagram
            url: https://instagram.com/wenyxdjane
          - type: facebook
            url: https://www.facebook.com/djanewenyx
          - type: soundcloud
            url: https://on.soundcloud.com/O02E1g9wpdbLcLUp3q
      - name: Ørjan Nilsen
        bio: >-
          Norwegian DJ and producer Ørjan Nilsen has been a fixture of the trance scene since his breakthrough on Armada
          Music in 2005. With four studio albums, collaborations with Armin van Buuren and Cosmic Gate, and the
          distinction of being the 7th most-played artist in A State of Trance history with over 125 million Spotify
          streams, his reach goes well beyond the dancefloor. Known for high-energy sets, he has performed at major
          clubs and festivals from São Paulo to Sydney.
        links:
          - type: soundcloud
            url: https://soundcloud.com/orjan_nilsen
          - type: instagram
            url: https://www.instagram.com/orjann82
          - type: tiktok
            url: https://www.tiktok.com/@orjannilsen
          - type: facebook
            url: https://www.facebook.com/OrjanMusic
