  - index: 19
    number: 21
    title: 21. Tech with us x Verbier Music (NE/VS)
    name: Tech with us x Verbier Music (NE/VS)
    genres: Techno to Hard Techno
    motto: A breath of fresh air in the heart of summer
    time: 16:52 - 20:52
    description: >-
      Our love mobile will bring winter in Summer. It means our collaboration between La Chaux-de- Fonds (1000m
      altitude) and Verbier (1500m altitude), which are together mountain cities, will bring a breath of fresh air in
      the middle of summer. The decoration will reflect this theme with ice and mountains.
    image:
      src: >-
        https://www.streetparade.com/media/pages/love-mobiles/tech-with-us/df29c14330-1782396460/bildschirmfoto-2026-06-25-um-16.02.32-450x.png
      alt: null
    artists:
      - name: '15:15'
        bio: >-
          15:15 delivers a sharp, fast-paced, and uncompromising hard techno sound, driven by pounding kicks and
          relentless energy. Drawing inspiration from the raw intensity of rave culture, 15:15 crafts explosive sets
          designed to hit hard from the very first track to the final drop.
        links: []
      - name: Byorn
        bio: >-
          BYORN is a Belgian hard dance/techno artist known for his emotionally charged, uplifting sound. Blending
          hard-hitting rhythms with mythic and atmospheric storytelling, his music is designed not just to move bodies,
          but to shift states of mind. Inspired by themes of transformation and ancient symbolism, BYORN creates tracks
          that feel both timeless and immediate.
        links:
          - type: soundcloud
            url: https://soundcloud.com/byornmusic
          - type: instagram
            url: https://www.instagram.com/byorn.music/
          - type: facebook
            url: https://www.facebook.com/BYORN.music
          - type: website
            url: https://de.ra.co/dj/byorn
      - name: Flymeon
        bio: >-
          With a transgressive style and a unique sound, Flymeon is an artist through and through. His signature sound
          and style that blends hard-hitting beats, screaming guitars and staggering synths, merging elements from
          Techno and Heavy Metal, Flymeon is ready to show the world what he has in store with a sound that’s
          one-of-a-kind.
        links:
          - type: soundcloud
            url: https://soundcloud.com/flymeonmusic
          - type: instagram
            url: https://www.instagram.com/flymeonmusic/
          - type: tiktok
            url: https://www.tiktok.com/@flymeonmusic
          - type: youtube
            url: https://www.youtube.com/channel/UCyP6rkwkwiQ3We0wrav-e1Q
      - name: Radio Slave
        bio: >-
          Radio Slave, the acclaimed alias of British DJ and producer Matt Edwards, is one of the most respected names
          in the global house and techno scene. Known for his hypnotic grooves, extended DJ sets, and innovative
          productions, he is also the founder of the influential REKIDS label. With performances at the world's leading
          clubs and festivals, Radio Slave delivers a timeless blend of underground house and techno that continues to
          inspire dance floors worldwide.
        links:
          - type: soundcloud
            url: https://soundcloud.com/radioslave
    links:
