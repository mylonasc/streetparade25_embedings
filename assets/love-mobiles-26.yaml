  - index: 25
    number: 25
    title: Orbit Events (ZH/SZ)
    name: Orbit Events (ZH/SZ)
    genres: Techno, Melodic Techno und Trance, Psy Trance
    motto: Eternal Harmony
    time: 15:40 - 19:40
    description: >-
      Boom! Once again, it is time for Street Parade and we'll participate for the 29th time in a row with our
      Lovemobile (Float). This year our motto is "Eternal Harmony". Visually, we will recreate that with a decoration in
      the colours of black and white. But why? They are opposing colors, but they do complement each other. They are
      even interdepending as neither would exist without the other. As in Ying and Yang or Day and Night. Our guests
      will also dress in black and white but in combination with silver. The first monochrome float.... Musically we
      will showcase some Trance heavyweights: Stars Cold Blue (DE), Ciaran McAulay (IE) as well as Kyau & Albert (DE)
      will make our day unforgettable with their music. Our resident DJ Fly is completing the line-up. Newcomer Alex
      Morales will take control of the warm-up until the official start. Of course, our gorgeous Splendid Dancers will
      get us in the mood for dancing with their dance animations.
    image:
      src: >-
        https://www.streetparade.com/media/pages/love-mobiles/orbit-events-zh/3290e18e7e-1780567511/flyer-26-mit-schrift-728x1030-450x.jpg
      alt: null
    artists:
      - name: Alex Morales
        bio: >-
          Geboren und aufgewachsen in der Schweiz, fliege ich eher unter dem Radar – und bringe trotzdem jeden
          Dancefloor mit meinen Beats in Bewegung. Seit über zehn Jahren liebe ich elektronische Musik – von groovigem
          House bis zu uplifting Trance. Von den NOK-Partys in der Roten Fabrik bis zur Street Parade vor über 100'000
          Menschen. Ich teilte Bühnen mit Robin Tune, Sneijder und Alex M.O.R.P.H. Mein Ziel: Ein Set, das im Herzen
          bleibt. Für immer!
        links:
          - type: soundcloud
            url: https://soundcloud.com/morales_morales
      - name: Ciaran McAuley
        bio: >-
          Over the past years, Ciaran McAuley has grown into one of the most respected names in uplifting and vocal
          trance. What began as a steady rise through consistent Beatport chart-toppers has evolved into full
          international recognition as both a producer with a distinct melodic identity and a DJ trusted on the biggest
          stages in the world. His touring history includes Tomorrowland, EDC Las Vegas, Dreamstate, Creamfields,
          Luminosity Beach Festival, and A State of Trance Festival
        links:
          - type: soundcloud
            url: https://soundcloud.com/ciaranmcauleyofficial
          - type: instagram
            url: https://www.instagram.com/ciaranmcauley
      - name: Cold Blue
        bio: >-
          Cold Blue is a Trance artist known for emotionally driven, long-form musical journeys that prioritize depth
          and atmosphere over short-form trends. With releases on leading labels such as Subculture, Kearnage and FSOE,
          he has earned multiple Beatport #1s and established a distinctive, timeless sound within the genre. Focusing
          on selected shows worldwide rather than extensive touring, Cold Blue delivers carefully curated DJ
          performances for a loyal, long-standing global audience.
        links:
          - type: soundcloud
            url: https://soundcloud.com/coldblue
          - type: facebook
            url: https://www.facebook.com/coldbluemusic
          - type: youtube
            url: https://www.youtube.com/@ColdBlueTv
          - type: instagram
            url: https://www.instagram.com/coldbluemusic
      - name: Fly
        bio: >-
          DJ Fly / ZH legt seit den frühen 90ern auf und spielt in der oberen Zürichsee-Region sowie Zürich. Seine Sets
          verbinden Trance, Techno und Melodic Techno zu innovativen, spannenden Klangerlebnissen. Seit 1996 ist er
          Resident bei Orbit Events und spielte auf Lovemobiles der Street Parade, Sunset Boat Partys, Orbit Night @ OXA
          und weiteren Events. Die eigenen Partys im Hela Mu, Kunstwerk und co-organisierte das Ruchweid Open Air.
        links: []
      - name: Kyau & Albert
        bio: >-
          With their own Kyau & Albert hits the DJ-band quickly made a name for themselves with their clever
          productions. Over the many years they released hit after hit and played at festivals like Tomorrowland, EDC,
          Electric Zoo, Creamfields, Nocturnal, Nature One, and Mayday as well as Luminosity Beach Festival or ASOT in
          Rotterdam. Highlights were shows at the Vancouver Olympic Games, Formula 1 races in Kuala Lumpur and Bahrain,
          and performances in countries like Peru, Mongolia, Guatemala, and Brazil
        links:
          - type: soundcloud
            url: https://soundcloud.com/euphonicsessions
          - type: instagram
            url: https://www.instagram.com/KyauAndAlbert
          - type: youtube
            url: https://www.youtube.com/KyauandAlbertTV
          - type: facebook
            url: https://www.facebook.com/kyauandalbertofficial
    links:
