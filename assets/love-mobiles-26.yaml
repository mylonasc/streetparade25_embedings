    number: 16
    title: 16. SUNSHINE LIVE (CH/DE)
    name: SUNSHINE LIVE (CH/DE)
    genres: Techno
    motto: 100% Electronic Music
    time: 16:07 - 20:07
    description: >-
      Mit dem SUNSHINE LIVE Love Mobile liefert SUNSHINE LIVE die besten elektronischen Beats direkt auf die Street
      Parade 2026. Seit fast 30 Jahren steht SUNSHINE LIVE für nonstop elektronische Sounds – 24 Stunden am Tag, 7 Tage
      die Woche. Ob im Radio, Web, in der App oder über zahlreiche Special-Interest-Streams: Hier trifft die
      elektronische Szene auf ihren Soundtrack. Das Love Mobile vereint treibende Beats, internationale DJs und pure
      Festival-Energie zu einem unvergesslichen Erlebnis mitten in Zürich. Von House über Techno bis Trance liefert
      SUNSHINE LIVE den perfekten Sound für alle Raver:innen und Electronic-Music-Fans. Mit weltweiten
      Event-Partnerschaften und internationalen Festivals bringt SUNSHINE LIVE die globale Clubkultur direkt zur Street
      Parade – laut, bunt und voller Liebe zur elektronischen Musik.
    image:
      src: >-
        https://www.streetparade.com/media/pages/love-mobiles/sunshine-live-ch-de/bad4d687da-1752218567/sunshine-live_optim-450x.jpg
      alt: null
    artists:
      - name: Falk
        bio: >-
          DJ Falk – seit über 2 Jahrzehnten feste Größe bei SUNSHINE LIVE und Impulsgeber der elektronischen Musikszene.
          Mit seinem Gespür für elektronische Musik, energiegeladene Sets und authentische Moderation begeistert er
          Club- und Radiofans gleichermaßen. Von House bis Trance & Techno – DJ Falk steht für Leidenschaft an den Decks
          & am Mikro.
        links:
          - type: instagram
            url: https://www.instagram.com/djfalkofficial/
          - type: soundcloud
            url: https://soundcloud.com/djfalkofficial
          - type: facebook
            url: https://www.facebook.com/djfalkofficial
          - type: website
            url: https://www.sunshine-live.de/falk
      - name: Luca Agnelli
        bio: >-
          Luca Agnelli ist einer der renommiertesten italienischen DJs und Produzenten im Hard Techno Bereich. Neben
          Releases auf u.a. Artcore, Filth On Acid & Drumcode hat sein eigenes Label Etruria Beat Records seit 2010
          zahlreiche internationale Artists veröffentlicht, darunter Nico Moreno, Alignment & Amelie Lens. Der
          renomierte Produzent arbeitet regelmäßig mit Musikschulen wie SAE Institute, SEEDJ und MAT Academy zusammen.
        links:
          - type: soundcloud
            url: https://soundcloud.com/lucaagnelli
          - type: instagram
            url: https://www.instagram.com/lucaagnelli/
          - type: tiktok
            url: https://www.tiktok.com/@lucaagnelli
          - type: facebook
            url: https://www.facebook.com/djlucaagnelli
      - name: Pretty Pink
        bio: >-
          Mit ihrer Leidenschaft für Melodic, Techno sowie Progressive House hat sie sich weltweit einen Namen gemacht
          und bespielte Festivals wie Tomorrowland, EDC Las Vegas, Lollapalooza, Ultra Music Festival und Parookaville.
          Mit Ihre Radioshow „DEEP WOODS“ (über eine Million Streams), zwei eigenen Labels & laufenden internationalen
          Tourneen befindet sich Pretty Pinks Karriere weiterhin auf Erfolgskurs.
        links:
          - type: soundcloud
            url: https://soundcloud.com/prettypink
          - type: instagram
            url: https://www.instagram.com/prettypinkmusic
          - type: website
            url: https://prettypink.de/
          - type: facebook
            url: https://www.facebook.com/prettypinkmusic
      - name: Vendex
        bio: >-
          Vendex ist ein vielseitiger Künstler, der Musik, Literatur, Film, Multimedia und Performance zu einem
          einzigartigen Gesamtkonzept vereint. Als international gefeierter Hard-Techno-DJ und Produzent begeistert er
          mit einem innovativen, experimentellen Sound. Mit seinen energiegeladenen Live-Sets und eindrucksvollen
          Produktionen erschafft Vendex epische Klangwelten und nimmt sein Publikum mit auf eine emotionale Reise durch
          faszinierende, alternative Universen.
        links:
          - type: instagram
            url: https://www.instagram.com/vendexofficial/?hl=de
          - type: soundcloud
            url: https://soundcloud.com/vendexofficial
          - type: youtube
            url: https://www.youtube.com/channel/UCqIUOUqPxkCialZEoYIAftQ
          - type: tiktok
            url: https://www.tiktok.com/@vendex_official
    links:
      - text: ''
        type: null
        url: https://www.sunshine-live.ch/
      - text: Tickets
        type: null
        url: https://eventfrog.ch/de/p/partys/electro/street-parade-2026-sunshine-live-love-mobile-7465789528344634117.html
