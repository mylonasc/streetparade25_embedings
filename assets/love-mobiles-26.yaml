  - index: 7
    number: 7
    title: 7. Tito Torres & Friends (AG)
    name: Tito Torres & Friends (AG)
    genres: Tech House, House, Progressive House
    motto: Dance For Unity
    time: 14:46 - 18:46
    description: >-
      Dance for Unity - Tanz wird als universelle Sprache verstanden, die Menschen über kulturelle und gesellschaftliche
      Grenzen hinweg verbindet. Im Zentrum des visuellen Erscheinungsbildes steht eine stilisierte Erdkuel mit einer
      dynamischen Tanz-Silhouette als Symbol für Bewegung, Energie und den Menschen im Mittelpunkt einer gemeinsamen
      Welt. Die bedruckten Blachen bilden die gestalterische Basis des Trucks. Sie sind in einem futuristisch wirkenden,
      metallisch-türkisen Farbraum gehalten und trasportieren visuell Rhythmus und Dynamik. Seitlich der zentralen Kugel
      sind kraftvolle Tanzmotive mit freisgestellten, dynamischen Personen in Bewegung integriert. Diese stehen
      sinnbildlich für Vielfalt, Ausdruck und internationale Verbundenheit. Das Gesamtkonzept vereint Bewegung, visuelle
      Kraft und Gemeinschaft in einer klaren, zeitgemässen From.
    image:
      src: >-
        https://www.streetparade.com/media/pages/love-mobiles/tito-torres-friends-zh/da646743af-1751450146/bildschirmfoto-2025-07-02-um-11.52.41-450x.png
      alt: null
    artists:
      - name: B.K.
        bio: >-
          Hinter dem sympathischen und erfolgreichen DJ B.K. stehen 20 Jahre solide, elektronische Musik höchster
          Qualität. Seine Reise führte ihn von lokalen Bars, über nationale Clubs und Festivals, bis hin zu
          internationalen Bühnen. Er sammelte seine musikalischen Erfahrungen an regelmässigen Auftritten im In- und
          Ausland, nah und fern, von Ibiza bis an die Strände der Südtürkei, was sich in seinem einzigartigen Stil bis
          heute widerspiegelt.
        links:
          - type: website
            url: https://djbk.ch/
          - type: facebook
            url: https://www.facebook.com/DeejayB.K
      - name: David Moreno
        bio: >-
          Born in Barcelona and based in Ibiza since 1989, this veteran radio DJ started in the mid-80s. Known for the
          legendary show “Ibiza Dance” and world tours with Space Ibiza, he has performed globally and worked with Carl
          Cox, Moby, and more. After 13 years with Ibiza Global Radio, he now leads Pure Ibiza Radio 97.2 FM—sharing the
          essence of Ibiza through passion, experience, and top-tier electronic sound.
        links:
          - type: website
            url: https://www.pureibizaradio.com/
          - type: soundcloud
            url: https://soundcloud.com/djdavidmoreno
      - name: Mario Ferrini
        bio: >-
          Growing up in Italy and Switzerland, Mario Ferrini was deeply influenced by both cultures. His unique musical
          sense blends vivacious Italian beats with precise Swiss mixing technique. Already spinning at the age of 14,
          he began taking audiences on a journey into his world of driving beats, emotions and passion for music. Mario
          plays all styles of house music, from vocal and latin house to funky and tech house. He has performed
          alongside artists such as Louie Vega, DJ Antoine and many more across Europe.
        links:
          - type: website
            url: https://marioferrini.com/
          - type: soundcloud
            url: https://soundcloud.com/ferrinirecords
          - type: instagram
            url: https://www.instagram.com/marioferrinim/
      - name: ROM 303
        bio: >-
          ROM 303 is a Berlin-based French DJ, producer, and co-founder of Rewind Concept & Volute Records. Known for
          groove-driven house and techno sets, he has performed at renowned clubs, festivals, and radio stations
          worldwide including Sisyphos, Fuse, Under Festival, and Ibiza Global Radio. As CSO at Algoriddim, creator of
          djay Pro, he connects underground electronic culture with innovative music technology.
        links:
          - type: instagram
            url: https://www.instagram.com/rom303_dj/
          - type: facebook
            url: https://www.facebook.com/ROM303/
          - type: soundcloud
            url: >-
              https://soundcloud.com/rom3-3?utm_id=97758_v0_s00_e233_tv0&fbclid=IwY2xjawSPW8RleHRuA2FlbQIxMABicmlkETBiSjhVYWxYbnhHRFZqWjZLc3J0YwZhcHBfaWQQMjIyMDM5MTc4ODIwMDg5MgABHkcsyOuJpnNlI89daqRpcPec7UUUTtkKRls3qjf9CXuwxd6eTc7YhHFQZe6__aem_p6KXIluzkMSU31GK_2_jtQ
      - name: Sachi Toyama
        bio: >-
          Sachi Toyama is for more than 15 years International and National DJ successfully go. Sachi Toyama presents
          the best of Tech-House, House, Deep House and convinced through honest and consistent sets! There are also
          various releases from him on Beatport and all sorts of online portals available. There are some new tracks
          from him this year released let surprise you.
        links:
          - type: facebook
            url: https://www.facebook.com/DJ-Sachi-Toyama-141003849255953/
      - name: Tito Torres
        bio: >-
          Swiss-Italian DJ & producer Tito Torres delivers dynamic and uplifting sets that blend classic house,
          progressive elements, and cutting-edge electronic sounds. With over 30 years in the music industry, he brings
          a wealth of experience to every performance. His productions enjoy support from respected names and labels,
          and with strong ties to Ibiza, Tito continues to leave his mark on the international electronic music scene.
        links:
          - type: instagram
            url: https://www.instagram.com/titotorresdeejay
          - type: facebook
            url: https://www.facebook.com/titotorresdj
          - type: soundcloud
            url: https://soundcloud.com/tito-torres
          - type: youtube
            url: http://www.youtube.com/user/djtitotorres
          - type: website
            url: https://tito-torres.com/
