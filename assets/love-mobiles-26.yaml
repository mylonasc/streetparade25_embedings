      Swissevents like Street Parade Zurich and SunIce Ice Festival. His originaltracks and remixes have garnered
      millionsof Spotify streams,placing him among Switzerland's top 50 Spotify artists in electronic music. His music
      has achievedinternational radio recognition and is played by renowned DJs like Tiesto.PASSIK's music is
      characterized by an innovative fusion of hardtechno with commercial elements, creating a unique sound
      thatresonates with a wide audience. Rosa Pagano Rosa Pagano is a Drum & Bass DJ and Producer, active on the Swiss
