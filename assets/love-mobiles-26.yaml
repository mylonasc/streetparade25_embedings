      - name: Nadine Vinzens
        bio: >-
          Nadine Vinzens is a Swiss DJ and producer with an international background in electronic music. After early
          performances in the United States at events such as Art Basel Miami and venues in Los Angeles and Miami, she
          continued her career across Europe and the Middle East. She has performed at major events including Street
          Parade Zurich, Rave The Planet Berlin and Electro Ziles Festival, as well as renowned clubs like Ritter Butzke
          Berlin.
