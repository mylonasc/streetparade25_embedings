      - name: Inamar
        bio: >-
          INAMAR produces a bright and sunny form of Melodic Techno and Progressive House. Born in Zurich to a Spanish
          mother and a Swiss father, she began her journey into electronic music after a trip to Ibiza, deeply inspired
          by the artists she discovered there.Her work caught the ear of the legendary David Guetta, who played her
