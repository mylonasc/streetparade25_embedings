      «Gabberbusters» verwandelt sich unser Love Mobile in eine rollende Einsatzzentrale gegen jede Form von Stille. 180
      BPM, kompromissloser Sound und eine Community, die die härtesten Styles der elektronischen Musik mit voller
      Leidenschaft lebt. Mit einem internationalen Line-up, jeder Menge Energie und einer unvergesslichen Atmosphäre
      liefern wir auch 2026 wieder eines der absoluten Highlights der Street Parade. Ob Newcomer oder Szene-Veteran –
      hier bebt der Asphalt! Who you gonna call? GABBERBUSTERS 👻 Alessio Sassano Alessio Sassano is an Italian hardcore
      and uptempo artist known for his high energyproductions, powerful kicks and explosive performances. With a rapidly
      growing reputationacross Europe, he continues to impress audiences with his uncompromising sound and passionfor
      the harder styles, making him one of the most exciting names of the new generation. Bäm Bäm Bäm Bäm – a longtime
      staple on the Hardcore Love Mobile at the Street Parade! Withrelentless, straight-up hardcore sets, he fires up
      the crowd and delivers pure, uncompromisingsound. Experience, energy, and passion – DJ Bäm Bäm brings exactly what
      the hardcore scene craves. DRS E.x.e.c.u.t.e E.X.E.C.U.T.E is one of the rising names in the uptempo hardcore
      scene. Known for hisaggressive kicks, dark atmospheres and relentless energy, he continues to build a
      strongreputation through powerful productions and explosive live performances.With releases on respected labels
      including Triple Six Records and a growing internationalfanbase, E.X.E.C.U.T.E is quickly establishing himself as
      a name to watch in the future ofhardcore and uptempo music. Giuly DJ Giuly (real name Giuliano Giuly) is a Swiss
      hardcore and Frenchcore DJ and producerwho’s been rocking the scene since the early 2000s. With over 130 gigs
      across Europe, heknows how to get the crowd moving with his fast, powerful beats and raw sound.Whether it’s huge
      festivals like Ravestorm and Hardcore Italia or clubs all over the continent,Giuly always brings that classic
      Frenchcore vibe that keeps fans hooked. J.D.A J.D.A is a Dutch hardcore DJ and producer and one of the most
      respected names in themillennium hardcore scene. As a member of the legendary Shadowlands Terrorists, he
      helpedshape the sound and culture of hardcore music for decades. Known for his powerful sets,timeless productions
      and unmistakable energy behind the decks, J.D.A continues to be afavourite among hardcore fans worldwide and
      remains an icon of the genre. Nitrile Nitrile – the fresh hardcore duo from Switzerland is shaking up the scene!
      With massive beats,relentless sound, and an explosive live show, they bring pure energy. Despite being new to
      thegame, they’ve already dropped powerful releases, proving they’re here to stay. Hardcore at itsfinest: raw,
      loud, Nitrile. The Cold Demon The Cold Demon is a hardcore artist known for his dark atmosphere, powerful sound
      designand relentless energy. Combining heavy kicks with a unique and sinister style, he has built agrowing
      reputation within the international hardcore scene. His productions and performancesdeliver pure intensity, making
      The Cold Demon a name that continues to attract attention fromhardcore fans worldwide. Tickets
  - index: 12
    number: 12
    title: 12. Disco Garten (ZH)
    name: Disco Garten (ZH)
    genres: House, TechHouse, Indie Dance
    motto: Forward to the past
    time: 15:31 - 19:31
    description: >-
      Der Disco Garten. Ein liebevoll gestalteter Ort für Musik, Begegnung und echte Verbindung. Wir besinnen uns zurück
      zum Wesentlichen – weg vom Spektakel, hin zu handgemachter Liebe zur elektronischen Musik, Gemeinschaft und
      bewusstem Feiern. Gemeinsam wollen wir ausgelassen tanzen, lachen, leben und den Moment spüren. Unser Wagen
      entsteht in Eigenarbeit, aus Holz und mit nachhaltigem Anspruch – als Zeichen gegen Wegwerfmentalität und für eine
      Zukunft, in der Feiern schön sein darf, ohne beliebig zu werden. Der Disco Garten ist ein Fest von Freunden für
      Freunde.
    image:
      src: https://www.streetparade.com/media/pages/love-mobiles/disco-garten/397776cee3-1783409150/disco-450x.jpg
      alt: null
    artists:
      - name: Clari Ann
        bio: >-
          Sie schafft eine Atmosphäre, die die Sinne ihrer Zuhörer anspricht und erhebt. Ihr Ziel ist es, nicht nur eine
          Verbindung zu ihrem Publikum aufzubauen, sondern auch wertvolle Erinnerungen zu hinterlassen, die noch lange
          nach dem Verklingen der Musik nachhallen. Ihre Absicht ist es, zu positivem Wandel beizutragen und eine
          inklusivere, mitfühlendere Welt zu fördern.
        links:
          - type: instagram
            url: https://www.instagram.com/clari_ann_/
          - type: soundcloud
            url: https://soundcloud.com/clariann
          - type: website
            url: https://www.clariann.com/
          - type: tiktok
            url: https://www.tiktok.com/@clari_ann__?_t=8sKGLlObbeQ&_r=1
      - name: FezzYFezz
        bio: >-
          Als FezzYFezz verkörpere ich zwei musikalische Seiten: Der eine Fezz strahlt mit fröhlichen, funky und
          housigen Sounds, während der andere Fezz in sphärische, melodische und bouncy Klänge eintaucht. Das „Y“ steht
          im Spanischen für „und“ und verdeutlicht das Zusammenspiel von Gegensätzen. Im Bereich von 90–130 BPM finde
          ich genügend vielseitiges Material, um ein tiefgründiges musikalisches Erlebnis zu schaffen, das dich
          hoffentlich tief bewegt!
        links:
          - type: instagram
            url: https://www.instagram.com/fezz_y_fezz/
          - type: soundcloud
            url: https://soundcloud.com/fezz_y_fezz
      - name: Khainz
        bio: >-
          Khainz ist ein Schweizer Techno-/House-Künstler, der für einen Sound bekannt ist, der sich zwischen
          chirurgischer Präzision und roher Dancefloor-Energie bewegt. Mit Veröffentlichungen auf Module, Spectrum,
          Siamese, Armada und Tomorrowland Music wurde seine Musik von Größen wie Tiësto, David Guetta, Armin van
          Buuren, Joris Voorn, Innellea, Kevin de Vries, Miss Monique und Korolova unterstützt.
        links:
          - type: website
            url: https://www.khainz.com/
          - type: instagram
            url: https://www.instagram.com/khainz
          - type: facebook
            url: https://www.facebook.com/khainzmusic/
          - type: facebook
            url: https://soundcloud.com/khainz
      - name: Progiglobi
        bio: >-
          Progiglobi bewegt sich zwischen treibendem Progressive Trance, dunklen Basslines und verspielten
          Überraschungen. Seine Sets sind Reisen – hypnotisch, emotional und manchmal komplett unerwartet. Mal tief und
          groovig, mal hart und chaotisch, aber immer mit Bewegung nach vorne. Trotz drückender Sounds bleibt Platz für
          Humor und echte Verbindung zur Crowd. Statt DJ-Ego steht für ihn im Fokus, Menschen aus dem Alltag zu ziehen
          und gemeinsam im Sound zu verschwinden.
        links:
          - type: soundcloud
            url: https://soundcloud.com/progiglobi
    links:
      - text: ''
        type: null
        url: https://kuebler-holzbau.ch/
      - text: ''
        type: null
        url: https://www.blastoff.ch/
