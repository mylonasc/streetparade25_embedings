  - index: 3
    number: 3
    title: 3. Friedas Büxe (ZH)
    name: Friedas Büxe (ZH)
    genres: House, Techno, Minimal
    motto: Liebe aus der Büxe
    time: 14:15 - 18:15
    description: >-
      Bunt in den Farben. Offen im Herzen. Frei im Geist. Unser Love Mobile steht für Vielfalt, Respekt offene Liebe und
      die Freude am Leben.
    image:
      src: >-
        https://www.streetparade.com/media/pages/love-mobiles/friedas-buexe-zh/134482e0a9-1780560711/img-6736-eqwkarei-qv3anpe9-kopie-450x.jpg
      alt: null
    artists:
      - name: Capt’n
        bio: >-
          His style is sexy, groovy, just playful House, Techhouse and Minimal / Deep Tech. It can be a bitdirty with
          punchy basslines or percussions and always with class. His music, his bright smile andhis energetic vibe
          leaves no one standing still and captivates every party guest.
        links:
          - type: soundcloud
            url: https://soundcloud.com/captain-fuego
          - type: instagram
            url: https://www.instagram.com/djcaptn_official/
      - name: Gianluca Felline
        bio: >-
          Die Musik liegt bei Gianluca Felline im Blut. Schon früh von seinem Vater, einem musiker und Soul-Sänger,
          inspiriert, entdeckte er seine Leidenschaft für die Musik. Bereits als Kind begann er,verschiedene Instrumente
          wie Klavier und Schlagzeug zu spielen und entwickelte ein tiefesVerständnis für Melodien und Rhythmen.
        links:
          - type: soundcloud
            url: https://soundcloud.com/gianlucafelline
          - type: instagram
            url: https://www.instagram.com/gianlucafelline_612/
          - type: website
            url: https://linktr.ee/gianlucafelline
      - name: Juzz
        bio: >-
          With an exceptional knack for the subtleties of electronic music, Juzz continuallypushesboundaries as a DJ and
          producer, crafting a sound that is both distinctive andmultifaceted.Drawing inspiration from House, Hip Hop,
          and Deep House of the late '90s, hemasterfullyblends simplicity with complexity to create a harmonious
          auditory experience.
        links:
          - type: soundcloud
            url: https://soundcloud.com/juzz
          - type: instagram
            url: https://www.instagram.com/_____juzz/
          - type: youtube
            url: https://www.youtube.com/user/Juzzzh
          - type: facebook
            url: https://www.facebook.com/juzzzh
      - name: Symoh Sares
        bio: >-
          Seit über 25 Jahren ist Symoh Sares ein fester Bestandteil der Schweizer House- und Techno-Szene. Mit seiner
          Leidenschaft für elektronische Musik, seinem feinen Gespür für Groove undseiner langjährigen Erfahrung hat er
          die Entwicklung der Szene über Jahrzehnte hinweg aktivmitgeprägt.
        links:
          - type: soundcloud
            url: https://soundcloud.com/symohsares
          - type: instagram
            url: https://www.instagram.com/symohsares
          - type: facebook
            url: https://www.facebook.com/symohsares
      - name: Theia
        bio: >-
          Based in Ibiza, THEIA (ES) is a dynamic DJ and producer known for her energetic, positiveunderground sets
          blending Minimal, Deep Tech, and UK grooves. She has graced the decks ofworld-class venues including Amnesia,
          Cova Santa, and Akasha, alongside international toursspanning Panama, NYC, Zanzibar, and Bali. Supported acts
          for icons like Marco Carola andJoseph Capriati, THEIA is also an accomplished producer with multiple Top 20
          Beatport tracks toher name.
        links:
          - type: instagram
            url: https://www.instagram.com/theia.es/
          - type: soundcloud
            url: https://soundcloud.com/theia_es
      - name: Valentino
        bio: >-
          Valentino ist ein leidenschaftlicher DJ aus Zürich, der tief in der Welt der elektronischen Musikverwurzelt
          ist. Mit Auftritten im legendären Amnesia Ibiza, im Space Ibiza und im Underground,sowie zahlreichen Berliner
          Clubs, hat er sich einen Namen gemacht. Als Besitzer der FriedasBüxe ist er nicht nur Gastgeber legendärer
          Nächte, sondern lebt seine Liebe zur elektronischenMusik in jedem Beat. Sein Sound verbindet tiefe Emotionen
          mit pulsierender Energie – eineReise, die Tanzflächen weltweit verbindet.
        links:
          - type: instagram
            url: https://www.instagram.com/valentino_official_dj/
          - type: soundcloud
            url: https://soundcloud.com/valentino-wfm
    links:
