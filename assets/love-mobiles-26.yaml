        type: null
        url: https://www.2akt.ch/
      - text: ''
        type: null
        url: https://www.4akt.ch/
      - text: ''
        type: null
        url: https://akt-niederdorf.ch/
      - text: ''
        type: null
        url: https://holenstein-gastro.ch/
      - text: ''
        type: null
        url: https://www.invasion.ch/
      - text: ''
        type: null
        url: https://www.richi-weiningen.ch/
