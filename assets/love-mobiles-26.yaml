  - index: 1
    number: 1
    title: 1. Drumcode x Friends of Street Parade (SWE/ZH)
    name: Drumcode x Friends of Street Parade (SWE/ZH)
    genres: House, Techhouse, Techno
    motto: Space
    time: 13:00 - 18:00
    description: >-
      Manche bauen ein Love Mobile. Wir bauen ein Erlebnis. Zusammen mit dem Schwedischen Techno-Label «Drumcode»
      erschaffen wir eine Welt, die für einen Tag alles Gewohnte vergessen lässt. Eine Welt voller Energie, Emotionen
      und elektronischer Klänge, in der Tausende Menschen gemeinsam feiern, tanzen und den Moment geniessen. Inspiriert
      von den Weiten des Weltraums entsteht eine Atmosphäre voller Licht, Farben und besonderer Momente. Was euch genau
      erwartet, bleibt noch unser Geheimnis – nur so viel sei verraten: Es wird überraschend, kreativ und mit viel Liebe
      zum Detail umgesetzt. Monatelange Planung, unzählige freiwillige Arbeitsstunden und die Leidenschaft unserer Crew
      verschmelzen zu etwas, das weit mehr ist als ein Truck. Es ist unser Beitrag zur grössten Technoparty der Welt –
      laut, bunt, einzigartig und mit ganz viel Herz. Willkommen in unserem Space!
    image:
      src: >-
        https://www.streetparade.com/media/pages/love-mobiles/friends-of-street-parade/23d5981163-1751017427/love_mobiles_sp_2022-450x.jpg
      alt: Friends
    artists:
      - name: Adam Beyer
        bio: >-
          A true electronic music pioneer, Adam Beyer has shaped the genre for over three decades,leading the charge as
          a DJ, producer, and founder of the legendary Drumcode label. In2025, he continues to push boundaries with his
          forward-thinking vision, blending hissignature sound with his first album in over 20 years ‘Explorer Vol.1’
          out in June.It’s also a year of major performances, including a sold-out Drumcode show at Drumsheds,London in
          March and a RESISTANCE Ibiza residency at Amnesia throughout the summershowing that Beyer remains a dominant
          force in electronic music. With Drumcode’s 30thanniversary approaching in 2026, his legacy continues to
          expand, proving that electronicmusic is an ever-evolving movement, and he remains one of its greatest
          innovators.
        links:
          - type: instagram
            url: https://www.instagram.com/realadambeyer
          - type: website
            url: https://www.drumcode.se/
          - type: soundcloud
            url: https://soundcloud.com/adambeyer
          - type: facebook
            url: https://www.facebook.com/realadambeyer
      - name: Bart Skils
        bio: >-
          Always one step ahead, Bart Skils stands as a defining force in the global techno movement. Celebrated for his
          dynamic, driving DJ sets, he crafts seamless journeys of rhythm and energy—each performance marked by his
          unmistakable rolling groove and intuitive connection with the crowd.
        links:
          - type: soundcloud
            url: https://soundcloud.com/bart-skils
          - type: instagram
            url: https://www.instagram.com/bart_skils/
          - type: website
            url: https://www.bartskils.com/
          - type: facebook
            url: https://www.facebook.com/djbartskils
      - name: Isabelle Beaucamp
        bio: >-
          Isabelle Beaucamp ist eine deutsche Techno-DJ und Produzentin aus Berlin. Mit ihrem energiegeladenen Sound aus
          Techno, Trance, Acid und globalen Einflüssen zählt sie zu den spannendsten Newcomerinnen der elektronischen
          Musikszene. Ihre Produktionen erreichten Top-Platzierungen auf Beatport, zudem gründete sie 2023 das Musik-
          und Fashion-Label „Bazar Sauvage“. Internationale Auftritte und ihre mitreissende Bühnenpräsenz machten sie
          weltweit bekannt.
        links:
          - type: soundcloud
            url: >-
              https://soundcloud.com/isabelle-beaucamp?utm_source=mobi&utm_campaign=social_sharing&si=bb112e9ada8d4f73aa15398b150ba96e
          - type: tiktok
            url: https://www.tiktok.com/@isabelle_beaucamp
          - type: instagram
            url: https://www.instagram.com/isabelle_beaucamp?igsh=dWJkMmFhNzZ2NGVm
          - type: website
            url: https://bazar-sauvage.com/isabelle-beaucamp/
      - name: Kaufmann
        bio: >-
          Kaufmann is a Berlin-based DJ and producer who has made a name for herself with an energetic blend of techno,
          dark minimal, and psychedelic influences. Since 2020, she has been releasing her own tracks on labels such as
          Stil vor Talent, SensoSounds, and Alula Tunes, and has firmly established herself in the German club scene and
          at festivals.
        links:
          - type: website
            url: https://de.ra.co/dj/kaufmann
          - type: instagram
            url: https://www.instagram.com/kaufmann.unofficial
          - type: soundcloud
            url: https://soundcloud.com/kaufmann_unofficial
          - type: website
            url: https://de.ra.co/dj/kaufmann
