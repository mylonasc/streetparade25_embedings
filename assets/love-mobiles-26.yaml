  - index: 8
    number: 8
    title: 8. Tanzgarten x Arosa (GR)
    name: Tanzgarten x Arosa (GR)
    genres: Afro House & Melodic House, Tech House
    motto: Alpine Dance Culture on Wheels
    time: 14:55 - 18:55
    description: >-
      Das Tanzgarten-Love Mobile bringt alpine Tanzkultur aus den Bergen mitten ins Herz von Zürich. Unter dem Motto
      «Alpine Dance Culture» verbindet das Projekt elektronischen Sound, Live- Performance, Hospitality und ein speziell
      inszeniertes Wagendesign zu einem hochwertigen Street-Parade-Erlebnis. Der Look in Schwarz, Grün und Weiß mit
      dezenten Shine-/Glitter- Akzenten steht für alpine Eleganz, Clubkultur und Festival-Energie. Musikalisch erwarten
      die Gäste Afro House, Melodic House und Tech House mit internationalen DJs, Live-Violine, Percussion, Saxophon und
      Dance-Performance. Kein klassischer Werbewagen, sondern ein rollender Tanzgarten mit besonderer Atmosphäre,
      starkem Sound und kuratiertem nationalem und internationalem Publikum.
    image:
      src: >-
        https://www.streetparade.com/media/pages/love-mobiles/tanzgarten-zh/0c766b4760-1783064081/bildschirmfoto-2026-07-03-um-09.34.07-450x.png
      alt: null
    artists:
      - name: Dre Guazzelli
        bio: >-
          Dre Guazzelli ist ein brasilianischer DJ, Music Healer, Produzent und Event-Creator aus São Paulo mit über 21
          Jahren Erfahrung. Als Local Hero derbrasilianischen elektronischen Szene verbindet er eigene
          erfolgreicheEventformate mit internationalen Bookings. Mit Auftritten u. a. bei Tomorrowland,World Club Dome
          und besonderen internationalen Events steht Dre für Charisma,positive Energie und Musik, die Menschen
          verbindet.
        links:
          - type: instagram
            url: https://www.instagram.com/dreguazzelli
          - type: soundcloud
            url: https://soundcloud.com/dreguazzelli
          - type: facebook
            url: https://www.facebook.com/dreguazzelli
          - type: website
            url: https://dreguazzelli.com/
      - name: Luqo – Live Saxophon
        bio: >-
          LUQO ist ein Berliner Multi-Instrumentalist, Musikproduzent und Live-Saxophonist mit eigenemStudio in den
          Riverside Studios Berlin. Seit seiner ersten Club-Residency mit 18 Jahren ist erinternational gefragt und
          spielte u. a. für Yves Saint Laurent in Paris, bei Parookaville, den MTVEuropean Music Awards sowie für Marken
          wie Porsche, Chanel, Dior, Rolls-Royce, Red Bull undTelekom. Mit über 100 Bookings jährlich steht LUQO für
          elektronische Musik, Saxophon und starkeLive-Energie.
        links:
          - type: instagram
            url: https://www.instagram.com/luqomusic/
          - type: facebook
            url: https://www.facebook.com/luqomusic/?locale=de_DE
      - name: Marisha – Live Violin
        bio: >-
          Marisha ist eine international gebuchte Live-Violinistin mit klassischer Ausbildung und modernerBühnenpräsenz.
          Sie spielte u. a. bei Events wie F1 Grand Prix, World Club Dome, Akasha Ibiza,Opera Ball Dubai und dem
          Hahnenkamm-Wochenende in Kitzbühel. Mit emotionalem Gespür fürelektronische Musik verbindet sie Live-Violine,
          Melodic House, Afro House und Tech House zueiner kraftvollen Performance.
        links: []
      - name: MIMMO
        bio: >-
          Seit über 30 Jahren steht MIMMO für treibende Beats, tiefe Grooves und authentischeAfro-House-Energie. Mit
          einem feinen Gespür für Atmosphäre und Rhythmus bringt erjedes Set auf ein neues Level – sei es auf
          internationalen Clubbühnen oder großenFestivals.
        links:
          - type: soundcloud
            url: https://soundcloud.com/djmimmo
          - type: facebook
            url: https://www.facebook.com/djmimmo.ch/
      - name: Paul Lomax
        bio: >-
          Paul Lomax ist DJ, Producer, Music Director und Gründer von Endless Entertainment sowieEndless City Records.
          Geprägt durch Ibiza, mit Stationen in Clubs wie Space, Amnesia, Privilege,Blue Marlin und Lío, spielte er
          weltweit auf Festivals, in Clubs und auf Premium-Events – vonDubai und Bangkok bis zur Rock & Roll Hall of
          Fame. Als Musikdirektor des Tanzgarten-Projektssteht er für emotionale Clubkultur und hochwertigen
          House-Sound.
        links:
          - type: instagram
            url: https://www.instagram.com/paul.lomax
          - type: soundcloud
            url: https://soundcloud.com/paul-lomax-endlesscity
          - type: website
            url: https://endlesscity-records.com/
          - type: facebook
            url: https://www.facebook.com/paul.lomax1
      - name: Valerio Lombardo – Live Percussion
        bio: >-
          Valerio Lombardo ist ein italienischer Live-Percussionist und E-Drummer mit Wohnsitz in Köln.Geprägt von
          Drums, Percussion und elektronischer Musik entwickelte er seinen eigenen kraftvollenLive-Stil. Er performte u.
          a. bei der Bambi-Verleihung für Celine Dion, spielte mit David Hasselhoffund ist gemeinsam mit LUQO
          international auf Premium-Events wie Bagatelle Saint Barth, UEFAEuro Finale und großen Public Events am
          Brandenburger Tor unterwegs. Seine Performance stehtfür Groove, Energie und direkte Verbindung zum Publikum.
        links:
          - type: facebook
            url: https://www.facebook.com/Valerio.Lombardo.Drums/?locale=de_DE
          - type: instagram
            url: >-
              https://www.instagram.com/Valerio.lombardo?fbclid=IwY2xjawS0SwxleHRuA2FlbQIxMABicmlkETBiSjhVYWxYbnhHRFZqWjZLc3J0YwZhcHBfaWQQMjIyMDM5MTc4ODIwMDg5MgABHlEHZ2OztZPLUJyvGe-uVOkohEyzl1rYvcdOIYmv1TDJPHCA6Gp5jFzSww4a_aem_aO54OJhq_F5TPBgViXJCwQ
