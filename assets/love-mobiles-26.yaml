  - index: 17
    number: 19
    title: 19. WE ARE UNITED (SZ, ZH, AG, BS, GE)
    name: WE ARE UNITED (SZ, ZH, AG, BS, GE)
    genres: Trance, Hardtrance
    motto: 90er Jahre Rave
    time: 16:34 - 20:34
    description: >-
      WE ARE UNITED steht für die verbindende Kraft der elektronischen Musik. Unser Love Mobile ist das Ergebnis eines
      Zusammenschlusses von fünf engagierten Akteuren der Schweizer Club und Trance Szene, die seit Jahrzehnten die
      Clubkultur prägen. Unser Love Mobile Motto ist NEON und Ravekultur der 90er.
    image:
      src: >-
        https://www.streetparade.com/media/pages/love-mobiles/spaceplanet-sz-zh-ag-bs-ge/959669f3e3-1781096491/bildschirmfoto-2026-06-10-um-15.01.03-450x.png
      alt: null
    artists:
      - name: Anyken
        bio: >-
          Anyken stands for emotional, energetic trance with an international appeal. His DJ sets combine powerful
          melodies, driving rhythms, and dense atmospheres into intense dancefloor moments. As a producer, his tracks
          receive worldwide support from greats like Tiësto, Armin van Buuren, and Paul van Dyk. With his event series
          Recall and Excelsis, he has been shaping the Zurich trance scene for years, strengthening the community with
          high-quality lineups.
        links:
          - type: instagram
            url: https://www.instagram.com/anyken_music/
          - type: website
            url: https://anyken-music.com/
          - type: facebook
            url: https://www.facebook.com/anykenmusic
          - type: soundcloud
            url: https://soundcloud.com/anyken
      - name: Bodo Kaiser
        bio: >-
          Bodo Kaiser ist seit über 15 Jahren als DJ, Produzent und Eventgestalter in der elektronischenMusikszene
          aktiv. Mit Releases auf Labels wie Freegrant, AVA und Black Hole Recordingserreichte er mehrfach die Beatport
          Top10. Er kollaborierte u. a. mit Ron van den Beuken,S.H.O.K.K. und KoRay und erhielt Support von Armin van
          Buuren, Above & Beyond, Paul van Dykund Cosmic Gate. Als Creative Director von Kaiser Entertainment entwickelt
          er zudemaudiovisuelle Konzepte für Festivals und Shows.
        links:
          - type: instagram
            url: https://www.instagram.com/bodokaisermusic/
          - type: facebook
            url: https://www.facebook.com/bodokaisermusic
          - type: soundcloud
            url: https://soundcloud.com/bodokaiser
          - type: website
            url: https://bodokaiser.com/
      - name: Jean Lostebien
        bio: >-
          Jean Lostebien, DJ und Produzent aus Genf, ist der Organisator des legendären Street Train Zürich. Mit 35
          Jahren Erfahrung in der Szene gestaltet er immersive musikalische Reisen von Trance bis zu Melodic Techno.
          Bekannt für seine MarzanEscape-Events und Residencies, liegt Jeans Leidenschaft darin, eine tiefe Verbindung
          zu seinem Publikum aufzubauen.
        links:
          - type: soundcloud
            url: https://soundcloud.com/jeanlostebien
          - type: facebook
            url: https://www.facebook.com/jeanlostebien/
          - type: website
            url: https://linktr.ee/jeanlostebien
          - type: instagram
            url: https://www.instagram.com/marzanprod/
      - name: Mario Piu
        bio: >-
          Mario Piu from Livorno belongs to the elite of the European electronic scene. His career led him from
          legendary clubs like Insomnia and BXR Superclub into the international charts: "Communication" reached #5 in
          the UK Sales Charts, and he climbed to #38 in the DJ Mag Top 100. Together with Mauro Picotto, he created
          classics like "Mas Experience". On his own label Fahrenheit, he releases electronic music away from the
          mainstream.
        links:
          - type: soundcloud
            url: https://on.soundcloud.com/VaggVLI9PMXUEyfOpO
          - type: facebook
            url: https://www.facebook.com/share/1SvtGGX7HZ/?mibextid=wwXIfr
          - type: instagram
            url: https://www.instagram.com/mariopiuofficial/
      - name: Partick Mathez
        bio: >-
          Patrick Mathez steht seit 1994 hinter den Decks. Nach zahlreichen Auftritten in der Schweiz sowie in England,
          Spanien und Italien legte er Anfang 2025 sein offizielles DJ-Comeback hin. Sein Sound verbindet Trance
          Classics mit modernem Uplifting und Progressive Trance. Als Gründer der Eventreihe Sanctuary of Trance prägt
          er die Schweizer Trance-Szene aktiv mit. Zu seinen jüngsten Highlights zählen Auftritte bei der Nature One, im
          Cyberdog London sowie die erfolgreichen Sanctuary of Trance Events in Luzern, Olten Zofingen.
        links:
          - type: instagram
            url: https://www.instagram.com/patrick_mathez/
          - type: facebook
            url: https://www.facebook.com/profile.php?id=61569835105521
          - type: soundcloud
            url: https://on.soundcloud.com/eqVwdl3OEmETGIo7k1
          - type: website
            url: https://www.sanctuaryoftrance.ch/
      - name: S.I.One
        bio: >-
          DJ S.I.ØNE has shaped electronic music culture since the 1980s. His project SPACEPLANET is a driving force of
          the international trance scene. In 1996, he mixed the official Street Parade video. As a producer (Tunnel
          Trance Force, Sony Music, BMG), over 5 million records were sold worldwide. With SPACEPLANET Records, Rimini
          Deep Records and releases like "Toward the Real You", he brings over 40 years of music history to the streets
          of the world in 2026.
        links:
          - type: website
            url: https://www.spaceplanet-official.com/
          - type: instagram
            url: https://www.instagram.com/spaceplanetofficial
          - type: facebook
            url: https://www.facebook.com/spaceplanetofficial
      - name: X-Plosiv
        bio: >-
          DJ X-Plosiv ist seit 1989 aktiv und ein Urgestein der Basler Trance-Szene. Als Resident-DJ und Veranstalter
          von Friends of Trance sowie ehemaliger Resident diverser Clubs prägte er die Szene über Jahrzehnte. Er spielte
          in zahlreichen Clubs, an Raves, Paraden und Open Airs, darunter Street Parade, Union Move München und Radio
          105 Mainstage. Zudem ist er Co-Host der Radiosendung «ElectroBeats» auf Radio X und veröffentlichte Tracks auf
          mehreren Labels.
        links:
          - type: soundcloud
            url: https://soundcloud.com/dj-x-plosiv
          - type: facebook
            url: https://www.facebook.com/deejayxplosiv
          - type: instagram
            url: https://www.instagram.com/djxplosiv
          - type: website
            url: https://linktr.ee/djxplosiv
