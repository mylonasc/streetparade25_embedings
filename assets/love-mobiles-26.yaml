  - index: 4
    number: 4
    title: 4. Daytona (AG)
    name: Daytona (AG)
    genres: Trance, Remember, Techno, Progessive
    motto: TIME - 25 Years Anniversary
    time: 14:22 - 18:22
    description: >-
      Dieses Jahr erzählt «TIME» unsere Geschichte. Vom ersten Funken einer Idee im Jahr 2000 bis zum ins Detail
      perfektionierten Projekt von heute – eine Reise voller Leidenschaft, Mut und unzähliger unvergesslicher Momente.
      25 Jahre sind nicht nur eine Zahl – sie sind Geschichten, Freundschaften, Begegnungen und die Evolution des Love
      Mobiles. Das sind Generationen von RaverInnen, DJs, VisionärInnen aus Technik, Grafik und kreativen Bereichen.
    image:
      src: >-
        https://www.streetparade.com/media/pages/love-mobiles/daytona-events-ag/51d73a3fdf-1780571615/bildschirmfoto-2026-06-04-um-13.13.03-450x.png
      alt: null
    artists:
      - name: Bonzai
        bio: >-
          Seit Jahrzehnten als DJ unterwegs und dankbar die 90er Jahre und somit die Trance Ära miterlebt zu haben. Sein
          Set an der Street Parade auf dem ETH Love Mobile und später auf dem Daytona Love Mobile sowie die legendären
          after Trance Partys im Palavrion gehören sicher zu den Highlights. Als Mitgründer von Uplift Events im Jahr
          2019 und den darauffolgenden, exklusiven Trance Partys «GARDEN OF MELODY» und «OCEAN OF HARMONY» kamen noch
          weitere, unvergessliche Momente hinzu.
        links:
          - type: instagram
            url: https://www.instagram.com/djbonzai_72/
          - type: facebook
            url: https://www.facebook.com/patrick.kung.568
      - name: Centaury
        bio: >-
          Centaury fand Mitte der 90er zu seiner grossen Leidenschaft Trance und ist diesem bis heute treu geblieben. Er
          spielt auch aktuell vor allem den guten alten Remember Trance.Er hat sich an den White Wolf Parties einen
          Namen gemacht hat seither so ziemlich in jedem Club der Schweiz aufgelegt, wo Trance gespielt wurde. Auch an
          grossen Raves wie Energy, Streetparade, Sonic, Motion, Mission Festival war er stehts dabei.International
          Referenzen sind Docks Markthalle in Hamburg, Gigaparc Düsseldorf, Siesta Alghero Sardinien, Euro Dance Palast
          Frankfurt, Nortrance Odense in Dänemark und neu auch Nature One.Er hat im Laufe der Zeit div. Tracks
          produziert. «Lazarus» mit Wavetraxx und aktuell die Single « DJ Sakin DJ Cantaury – ZOOM».DJ Centaury
          veranstaltet und hostet seit Jahren Events unter «Remember Classixx».
        links:
          - type: instagram
            url: https://www.instagram.com/haldimannsascha
          - type: facebook
            url: https://www.facebook.com/sascha.haldimann
          - type: soundcloud
            url: https://soundcloud.com/djcentaury
          - type: youtube
            url: https://www.youtube.com/watch?v=krP-K6BnUH0
      - name: Dee Jay G.P.
        bio: >-
          Dee Jay G.P ist seit 2003 auf dem Daytona Love Mobile dabei. Er ist ein Artist mit vielen Facetten. Sein
          leidenschaftlichstes Genre seit Mitte der 90er Jahre ist und bleibt Trance. Anfangs war er in diversen Clubs
          und kleineren Partys (bis zur Mainstation) unterwegs. Heute ist er OK-Chef des Daytona Love Moblie, welches
          seit dem Jahr 2000 ununterbrochen an der Street Parade mit dabei ist. Er ist Mitgründer des Labels Uplift
          Events, welches seit 2019 Trance und Remember Events organisiert. Jeweils auch die Love Mobile After Party
          anschliessend an die Street Parade. Diverse exclusive Events (GARDEN OF MELODY, OCEAN OF HARMONY) entstanden
          ebenfalls während den letzten Jahren… and the beat goes on and on…
        links:
          - type: instagram
            url: https://www.instagram.com/daniel.wuestgp
          - type: website
            url: https://www.djgp.ch/
          - type: facebook
            url: https://www.facebook.com/daniel.wuestgp
      - name: Fabio G
        bio: >-
          Seid über 20 Jahren beim Daytona Team dabei und diesmal auch wieder am DJ Pult.Geboren am 21. Mai 1983 in
          Sisseln, entdeckte ich bereits mit 12 Jahren im Jugendclub Sisseln meine Leidenschaft fürs DJing. Nach ersten
          Mixversuchen und meinem ersten Rave war klar: Musik ist mein Weg. Nach Jahren intensiven Trainings und
          zahlreichen Auftritten folgten Highlights wie die Street Parade 2004, ein Mega Rave in Italien und die Goliath
          2006. Heute lege ich hobbymässig Remember Trance auf – Musik voller Emotionen und Erinnerungen.
        links: []
      - name: Johan Gielen
        bio: >-
          Johan Gielen is a Dutch trance legend and globally respected DJ and producer. With iconic projects such as
          Airscape and Svenson & Gielen, he has left a lasting mark on the international dance scene. His energetic
          sets, emotional melodies, and timeless trance classics continue to ignite dancefloors at clubs and festivals
          worldwide, connecting generations of ravers through pure passion and unforgettable energy.
        links:
          - type: website
            url: https://johangielen.com/
          - type: soundcloud
            url: https://soundcloud.com/johan-gielen-official
          - type: youtube
            url: https://www.youtube.com/user/johangielenoffical
          - type: facebook
            url: https://www.facebook.com/johangielenmusic/
      - name: Nuphaze
        bio: >-
          NUPHAZE ist ein Trance-Projekt von Jens Sidler & Chris Gantenbein. Die beiden Musiker feierten auch mit ihren
          House-Projekten „The Good Guys“, „Nikolaz & Gant“ und „Nikolaz“ Erfolge und arbeiteten als offizielle Remixer
          für AVICII, Thomas Gold, Yves Larock, Richard Grey, Remady und weitere Künstler. Zu den bekanntesten
          NUPHAZE-Veröffentlichungen zählen „Space Vibrations“, „Signs of Life“ und „Mental Thing 2005“, erschienen
          zwischen 2001 und 2005.
        links:
          - type: facebook
            url: https://www.facebook.com/nuphazeofficial
      - name: Quicksilver
        bio: >-
          Orhan Terzi alias DJ Quicksilver ist ein in der Türkei geborener und in Deutschland lebender DJ und Produzent,
          der seit Jahren zu den bekanntesten Künstlern der internationalen Dance-Szene gehört. Bekannt wurde er durch
          Hits wie „Bingo Bongo“, „Bellissima“ und „Free“, die hohe Chartplatzierungen und Goldstatus erreichten.
          Gemeinsam mit Tommaso De Donatis produzierte er außerdem erfolgreiche Remixe für Künstler wie Faithless, Jam &
          Spoon und Chicane und etablierte sich damit auch international als erfolgreicher Remixer und Produzent.
        links:
          - type: soundcloud
            url: https://soundcloud.com/dj_quicksilver?utm_source=chatgpt.com
          - type: website
            url: https://dj-quicksilver.com/
          - type: instagram
            url: https://www.instagram.com/dj_quicksilver/
          - type: youtube
            url: https://www.youtube.com/user/dustsucka
      - name: S.P.H.E.R.E
        bio: >-
          Er startete seine Kariere Mitte der 90iger Jahre. Mit kleineren Auftritten in Bars in der Region Baden
          sammelte er erste Erfahrungen vor Publikum im Umgang mit Vinyl.Um die Wende ins 2000 kamen die ersten
          grösseren Gigs – wie Goliath, White Wolf, Energy, Sonic, DJ Invasion und andere. Auch kleinere Auftritte im
          Ausland die aber keine grosse Rolle spielten. Auch Auftritte in den wichtigen Clubs wie Mad Lausanne und Oxa
          folgten ziemlich rasch…2004 mit dem Release von Give a little Love – welcher sich 8 Wochen lang in den VIVA
          Swizz Dance Charts hielt, hatte er einen ersten grösseren Durchbruch und wurde dadurch an viele kommerzielle
          grosse Events schweizweit gebucht. Darauf folgen auch Auftritte an der Nature One im Energy Zelt, Hardbass in
          Holland oder Q Base.Seine Sets zeichnen sind durch dynamisch-treibende Tracks aus. Zudem auch in seiner
          speziellen Mixtechnik. Da gibt es nur eines zu sagen, hört es euch an und urteilt selbst…
        links:
          - type: soundcloud
            url: https://soundcloud.com/synergyofficiel/sphere-live-hte-zurich
          - type: facebook
            url: https://www.facebook.com/share/18eCHWJ3sP/?mibextid=wwXIfr
      - name: Tatana
        bio: >-
          Mit 20 Gold- und 6 Platin Awards ist Tatana die Leaderin der Schweizer Dance-Industrie – und die erste DJ, die
          dreimal Mal die Hymne der Street Parade komponierte. Ihr erstes Set spielte sie an der Street Parade und
          Energy 1998. Zweimal, 1998 und 1999, gewann sie den Swiss DJ Award. Ihre Single „Words“ wurde zum
          erfolgreichsten Schweizer Dance-Hit. Tatana ist mit über 500’000 verkauften Tonträgern und 5 Nummer-1-Alben
          die Queen of Trance und führende Persönlichkeit der Elektro-Dance-Szene.
        links:
          - type: instagram
            url: https://www.instagram.com/djtatana
          - type: facebook
            url: https://www.facebook.com/djtatana/
          - type: x
            url: https://x.com/DJTatana
