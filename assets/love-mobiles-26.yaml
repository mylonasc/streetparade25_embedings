  - index: 10
    number: 10
    title: 10. Sonntagskinder (LU)
    name: Sonntagskinder (LU)
    genres: Techhouse, Melodic Techno
    motto: 90s Rave
    time: 15:13 - 19:13
    description: >-
      Zum 7. Mal sind die Sonntagskinder Teil der Street Parade und bereit, gemeinsam mit euch die Strassen in ein
      buntes Meer aus Musik, Freude und Energie zu verwandeln. 🌈 Motto 2026: 90er RAVE 🌈 Wir feiern die Zeit der
      legendären Raves, der grenzenlosen Freiheit und der unvergesslichen Nächte. Neonfarben, treibende Beats und pure
      Lebensfreude stehen im Mittelpunkt. 💥 Dresscode: Neon, bunt, schrill und alles, was leuchtet! Auf unserem 35
      Meter langen Love Mobile erwarten euch druckvolle Sounds, kühle Getränke, eine Toilette an Bord und eine
      einzigartige Atmosphäre voller guter Vibes. Wenn der Bass durch die Straßen rollt, die Hände in die Luft gehen und
      tausende Menschen gemeinsam feiern, entstehen Erinnerungen, die bleiben. 🫶 Sonntagskinder – mehr als ein Name.
      Eine Gemeinschaft. Ein Gefühl. Eine Familie.
    image:
      src: >-
        https://www.streetparade.com/media/pages/love-mobiles/sonntagskinder-lu/56cdfe47bd-1781768478/bildschirmfoto-2026-06-18-um-09.40.43-450x.png
      alt: null
    artists:
      - name: Chris.P
        bio: >-
          Musik bedeutet für mich Freiheit. Der Einfluss, welcher die Musik auf mein Leben hatte, zeichnet sich heute in
          all meinen Lebensbereichen ab. Im Jahr 1998 entdeckte ich die Anziehung zur elektronischen Musik und kaufte
          die ersten Vinyls die schnell immer mehr geworden sind. Daraufhin folgten die ersten kleinen Partys. Es war
          toll den Leuten diese Freude an dem eigenen Sound an zu sehen. Einige Zeit später gründete ich zusammen mit
          Freunden die Sonntags Kinder, wir haben in den letzten Jahren die ein oder andere Party veranstaltet.
