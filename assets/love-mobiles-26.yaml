  - index: 5
    number: 5
    title: 5. Sunrise Love Mobile
    name: Sunrise Love Mobile
    genres: House, Afrohouse, Techhouse
    motto: Where music connects us
    time: 14:30 - 18:30
    description: >-
      Sunrise ist auch dieses Jahr Presenting Partner der Street Parade und sorgt mit dem Love Mobile für mitreissende
      Stimmung am grössten Electronic Music Event der Welt. Mit an Bord sind Top-DJs wie Dangel Twins, AIIA,
      whereisvero, Maks und Gil Glaze, die den Beat für einen unvergesslichen Tag auf den Strassen Zürichs liefern.
      Gemeinsam feiern wir kulturelle Vielfalt, die Faszination elektronischer Musik und die einzigartige Atmosphäre der
      Street Parade – laut, bunt und voller Liebe. Sunrise Love Mobile – where music connects us. One beat, one love,
      one city.
    image:
      src: https://www.streetparade.com/media/pages/love-mobiles/sunrise-x-riser/c8f51aed8d-1783699473/1080x1080-450x.jpg
      alt: null
    artists:
      - name: AIIA
        bio: >-
          AIIA ist ein elektronisches DJ-Duo aus Zürich, bestehend aus AANN und Anchi. Mit über einem Jahrzehnt
          Erfahrung vereinen sie technische Präzision, weibliche Power und ein feines Gespür für den Dancefloor. Ihr
          Sound bewegt sich zwischen melodischen Atmosphären und treibenden House- und Techno-Grooves. Mit Auftritten an
          Events wie Street Parade, Terrazzza, Hive Air und internationalen Festivalbühnen begeistern sie ihr Publikum
          mit energiegeladenen und emotionalen Sets
        links:
          - type: instagram
            url: https://www.instagram.com/aiia.music_
          - type: website
            url: https://linktr.ee/AIIA
          - type: soundcloud
            url: https://soundcloud.com/aiiamusic
      - name: Dangel Twins
        bio: >-
          Die Dangel Twins aus Zürich zählen zu den spannendsten Acts der Schweizer Electronic-Music-Szene. Die
          Zwillingsbrüder Ben und Chris begeistern mit ihrem einzigartigen Mix aus Melodic und Afro House, treibenden
          Grooves und mitreißender Energie. Mit Auftritten in Ibiza, Dubai, Mykonos und auf den renommiertesten Bühnen
          der Schweiz sowie Supports für internationale Top-Acts sorgen sie weltweit für unvergessliche
          Dancefloor-Momente
        links:
          - type: instagram
            url: https://www.instagram.com/dangeltwins/
          - type: soundcloud
            url: https://soundcloud.com/dangeltwins
          - type: tiktok
            url: https://www.tiktok.com/@dangeltwins
          - type: youtube
            url: https://www.youtube.com/@dangeltwins
      - name: Gil Glaze
        bio: >-
          Gil Glaze aus Zürich gehört zu den international erfolgreichsten Schweizer DJs und Produzenten. Mit
          energiegeladenen Sets zwischen House, Deep House und EDM begeistert er Clubs und Festivals rund um den Globus.
          Auftritte an renommierten Events wie Ultra Music Festival sowie Kollaborationen mit internationalen Größen und
          Supports von Künstlern wie Tiësto, Afrojack oder Martin Garrix unterstreichen seinen weltweiten Erfolg.
        links:
          - type: soundcloud
            url: https://soundcloud.com/gilglaze
          - type: instagram
            url: https://www.instagram.com/gilglaze
          - type: website
            url: https://www.gilglaze.com/
          - type: facebook
            url: https://www.facebook.com/GilGlaze
      - name: Jaquet
        bio: ''
        links:
          - type: instagram
            url: https://www.instagram.com/yves_jaquet/
          - type: website
            url: >-
              https://hoo.be/yves_jaquet?fbclid=PAZXh0bgNhZW0CMTEAAae_Ox_vCMtjog8NG7jK2ezxk_xlfmzSBDk7MsPfsKKB3LTACT3lWq8uVOqkkw_aem_S1sgO2MjHsh3pJPDjKeJVg
          - type: soundcloud
            url: https://soundcloud.com/jaquet_ofc
          - type: tiktok
            url: https://www.tiktok.com/@jaquet.ofc?_t=8mmoRkX3eIi&_r=1&utm_source=hoobe&utm_medium=social
      - name: Maks
        bio: >-
          MAKS zählt zu den aufstrebenden Namen der elektronischen Musikszene. Mit seinem charakteristischen Sound
          zwischen Melodic House, Deep House und treibenden Grooves schafft er emotionale wie energiegeladene Momente
          auf dem Dancefloor. Seine Sets verbinden musikalische Tiefe mit moderner Club-Ästhetik und führten ihn bereits
          auf renommierte Bühnen wie das SunIce Festival in St. Moritz
        links:
          - type: instagram
            url: https://www.instagram.com/maks.ofc/?hl=de
          - type: soundcloud
            url: https://soundcloud.com/maksmusic
      - name: Whereisvero
        bio: >-
          Whereisvero ist eine aufstrebende Schweizer DJ und Produzentin mit einem einzigartigen Mix aus Afro House,
          Melodic House und warmen, groovigen Sounds. Ihre energiegeladenen Sets verbinden tiefe Rhythmen, emotionale
          Melodien und moderne elektronische Klänge. Als Resident-DJ des Zürcher Eventlabels HEART begeistert sie
          regelmässig Clubs und Festivals in der ganzen Schweiz
        links:
          - type: instagram
            url: https://www.instagram.com/whereisvero_
          - type: website
            url: https://ubwg.ch/artist/whereisvero/
          - type: soundcloud
            url: https://soundcloud.com/whereisvero
