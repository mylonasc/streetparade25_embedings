[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streetparade-embeddings"
version = "0.1.3"
description = "SoundCloud download and CLAP embedding pipeline for Street Parade research analysis."
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi",
  "numpy",
  "pydantic",
  "scikit-learn>=1.7.2",
  "uvicorn",
]

[project.optional-dependencies]
chroma = [
  "chromadb",
]
embedding = [
  "beautifulsoup4",
  "lxml[html-clean]>=6.1.1",
  "nest-asyncio>=1.6.0",
  "pydub",
  "PyYAML",
  "requests-html>=0.10.0",
  "soundcloud-lib",
  "torch",
  "transformers",
  "yt-dlp",
]
full = [
  "beautifulsoup4",
  "chromadb",
  "lxml[html-clean]>=6.1.1",
  "nest-asyncio>=1.6.0",
  "pydub",
  "PyYAML",
  "requests-html>=0.10.0",
  "soundcloud-lib",
  "torch",
  "transformers",
  "yt-dlp",
]
discovery = [
  "lxml_html_clean",
  "requests-html",
]
notebooks = [
  "datasets",
  "matplotlib",
  "pandas",
  "tqdm",
]
dev = [
  "pytest",
  "PyYAML",
]
docs = [
  "myst-parser",
  "sphinx",
  "sphinx-autodoc-typehints",
  "sphinxcontrib-plantuml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "live_download: tests that download media from external SoundCloud/YouTube URLs",
]
