apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sp26-emb-prod.fullname" . }}-visualizer
  namespace: {{ include "sp26-emb-prod.namespace" . }}
  labels:
    {{- include "sp26-emb-prod.labels" . | nindent 4 }}
    app.kubernetes.io/component: visualizer
spec:
  replicas: {{ .Values.visualizer.replicaCount }}
  selector:
    matchLabels:
      {{- include "sp26-emb-prod.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: visualizer
  template:
    metadata:
      labels:
        {{- include "sp26-emb-prod.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: visualizer
      annotations:
        {{- toYaml .Values.visualizer.podAnnotations | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: visualizer
          image: {{ include "sp26-emb-prod.image" (dict "repository" .Values.image.repository "tag" .Values.visualizer.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: web
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.visualizer.resources | nindent 12 }}
        {{- if .Values.visualizer.apiProxy.enabled }}
        - name: api-proxy
          image: {{ .Values.visualizer.apiProxy.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: api-proxy
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: api-proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /health
              port: api-proxy
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: api-proxy
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.visualizer.apiProxy.resources | nindent 12 }}
        {{- end }}
      {{- if .Values.visualizer.apiProxy.enabled }}
      volumes:
        - name: api-proxy-config
          configMap:
            name: {{ include "sp26-emb-prod.fullname" . }}-api-proxy
      {{- end }}
      {{- with .Values.visualizer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.visualizer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.visualizer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
