namespace:
  create: false
  name: sp26-emb-live

fullnameOverride: sp26-emb

image:
  repository: mylonasc/magarathea
  pullPolicy: Always
  pullSecrets:
    - name: dockerhub-regcred

api:
  replicaCount: 1
  image:
    tag: api-minimal-0.1.3
  service:
    type: ClusterIP
    port: 8000
  env:
    STREETPARADE_DB: /data/streetparade_embeddings.sqlite3
    STREETPARADE_VECTOR_STORE: numpy
    STREETPARADE_NUMPY_VECTOR_DIR: /data/vectorstore
    ENABLE_SONG_DL_AND_EMBEDINGS: "0"
    STREETPARADE_CORS_ORIGINS: ""
    STREETPARADE_CORS_ORIGIN_REGEX: "https?://.*"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

visualizer:
  replicaCount: 1
  image:
    tag: visualizer-0.1.12-d17cf881e5fe
  service:
    type: ClusterIP
    webPort: 80
    apiProxyPort: 8000
    annotations: {}
  apiProxy:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

persistence:
  enabled: true
  existingClaim: sp26-emb-data
  keep: true
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 2Gi

ingress:
  enabled: true
  className: ""
  host: magarathea.ddns.net
  basePath: /streetparade-navigator-2026
  trailingSlashRedirect: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
  tls:
    - hosts:
        - magarathea.ddns.net
      secretName: magarathea-ddns-net-tls
