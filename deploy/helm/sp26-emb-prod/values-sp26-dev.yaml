namespace:
  create: false
  name: sp26-dev

fullnameOverride: sp26-emb

image:
  repository: mylonasc/magarathea
  pullPolicy: Always
  pullSecrets:
    - name: dockerhub-regcred

api:
  replicaCount: 1
  image:
    # Path-agnostic build, identical recipe to the prod minimal API.
    # Kept on the *-test-* tag (proven on /sp26-prod) until
    # publish-dockerhub.yml builds path-agnostic minimal images.
    tag: api-test-0.1.2
  service:
    type: ClusterIP
    port: 8000
  env:
    STREETPARADE_DB: /data/streetparade_embeddings.sqlite3
    STREETPARADE_VECTOR_STORE: numpy
    STREETPARADE_NUMPY_VECTOR_DIR: /data/vectorstore
    ENABLE_SONG_DL_AND_EMBEDINGS: "0"
    STREETPARADE_CORS_ORIGINS: ""
    STREETPARADE_CORS_ORIGIN_REGEX: "https?://.*"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

visualizer:
  replicaCount: 1
  image:
    # Path-agnostic visualizer (fe-visualizer/Dockerfile, VITE_BASE_PATH=./).
    # MUST be path-agnostic - the chart's UI ingress rewrites the base path,
    # and the path-locked visualizer-minimal-* build serves its "ok" health
    # response instead of the app. Proven on /sp26-prod.
    tag: visualizer-test-0.1.2
  service:
    type: ClusterIP
    webPort: 80
    apiProxyPort: 8000
    annotations: {}
  apiProxy:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

persistence:
  enabled: true
  existingClaim: ""
  keep: true
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 2Gi

ingress:
  enabled: true
  className: ""
  host: magarathea.ddns.net
  basePath: /streetparade-navigator-2026
  trailingSlashRedirect: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
  tls:
    - hosts:
        - magarathea.ddns.net
      secretName: magarathea-ddns-net-tls
