{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sp26-emb-test.fullname" . }}-navigator-ui
  namespace: {{ include "sp26-emb-test.namespace" . }}
  labels:
    {{- include "sp26-emb-test.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.basePath }}(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "sp26-emb-test.fullname" . }}-visualizer
                port:
                  name: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sp26-emb-test.fullname" . }}-navigator-api
  namespace: {{ include "sp26-emb-test.namespace" . }}
  labels:
    {{- include "sp26-emb-test.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.basePath }}/api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "sp26-emb-test.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
{{- end }}
