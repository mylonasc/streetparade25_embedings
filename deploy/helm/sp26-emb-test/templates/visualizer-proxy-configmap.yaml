{{- if .Values.visualizer.apiProxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sp26-emb-test.fullname" . }}-api-proxy
  namespace: {{ include "sp26-emb-test.namespace" . }}
  labels:
    {{- include "sp26-emb-test.labels" . | nindent 4 }}
    app.kubernetes.io/component: visualizer
data:
  default.conf: |
    server {
      listen 8000;

      location / {
        proxy_pass http://{{ include "sp26-emb-test.fullname" . }}-api:{{ .Values.api.service.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
{{- end }}
