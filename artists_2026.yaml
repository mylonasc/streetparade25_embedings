  info:
  - 20:00 Clubbing Stage
  bio: The Lucerne born DJ blends timeless grooves and contemporary sounds into a playful and energetic mix. Vera Amberg creates
    a timeless narrative that showcases her diverse interests within electronic music. Her mixes are characterized by its
    bright energy, which is reflected in tribal-infused beats, grooving baselines and heartfelt melodies. Vera's music selections
    span across various genres, including breaks, house, techno, electro and trance. By blending dance music from previous
