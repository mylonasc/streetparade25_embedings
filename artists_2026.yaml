  bio: Contenance is a swiss based DJ and Producer. His love for music planted an urge to dive in deeper into mixing his own
    sounds. So he started meeting frequently, exchanging tracks and mixing together all kinds of different sounds he enjoyed
    at the time. Music has always been a big part in his live, whether it would be trying out different instruments or playing
    in bands, or just plainly consuming sounds from all parts of the world and from all kinds of different genres. These many
    influences can be heard in his own productions. Contenance don’t likes to limit himself with genre boundaries, he would
    rather try to blend in different styles into something new and exciting. Sometimes he likes it emotional and spherical,
