  bio: 'OXY ist das Psytechno-Projekt der aus dem Süden Frankreichs stammenden Künstlerin Maë. Nach mehreren Jahren intensiver
    Auseinandersetzung mit Techno tauchte sie 2015 tief in die Welt des Psytrance ein. Diese musikalische Entwicklung führte
    sie schon bald hinter die Decks internationaler Bühnen, während sie parallel begann, eigene Musik zu produzieren.2017
    gründete Maë gemeinsam mit Partner:innen das Label Chronozone Records. 2023 folgen Veröffentlichungen und Kollaborationen
    mit PointZero Records sowie Techgnosis Records.Im Jahr 2024 markierte OXY einen weiteren Meilenstein: die Veröffentlichung
    des ersten eigenen Tracks, der Beitritt zu Volkane Records sowie das Debüt des ersten Live-Sets.Chapora, India · CO2,
