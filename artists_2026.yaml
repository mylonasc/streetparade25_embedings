- name: gi0si • Hidden Club (SO)
  image: https://www.streetparade.com/media/pages/line-up/gi0si/92d057304c-1784625424/phantom-320x.png
  info:
  - 16:00 Clubbing Stage
  bio: Sergio Similis aka Seranthonys career as a DJ began in the early 90s in the small town Solothurn. While many DJs started
    their career in Solothurn and then moved to the bigger cities like Zurich or Berne, Sergio remained faithful to the arguably
    most beautiful baroque city of Switzerland and dedicated himself to developing the club culture in this city. With his
    club “the hidden” which he opened in 2002 with his buddy Bidu, he not only created a cultural space in his city, but created
    a flagship for the world of electronic underground music. This tiny, underground venue opens twice a month and invites
    guests like Chez Damier, Motor City Drum Ensemble, Gerd Janson, Thomas Melchior, but also works a lot with national and
    regional DJs. Sergio himself doesn’t like to be in the spotlight but when he stands behind the decks, be it at the hidden,
    at the Cabaret in Zurich, Space Ibiza, Katerholzig Berlin or anywhere else, there’s always a sort of magic in the air.
    He always spinns the right record at the right time.
