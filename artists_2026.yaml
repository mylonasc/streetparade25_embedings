  bio: Prodelic ist ein musikalischer Architekt, der klangliche Dimensionen formt, wo tiefe hypnotische Rhythmen auf das Echo
    des Unterbewusstseins treffen. Eine Klangreise, die die kosmische Leere zwischen Dschungelklängen, Psychedelia und menschlicher
    Wahrnehmung überbrückt. Mit seiner immensen Leidenschaft für Psychedelic Trance hat er über die Jahre seinen ganz eigenen
    Sound entwickelt. Als Kontrast zu der digitalen Grundstruktur seiner Musik greift er immer wieder auf organische Elemente
    wie Trommeln und Gesänge zurück. Diese Elemente ringen noch lange nach, auch wenn der letzte Kick schon längst verstummt
    ist. Seine Musik wurde auf verschiedenen Labels veröffentlicht, darunter Bom Shanka Music (UK), Patronus Records (CH),
    Psyrituals (IND), Nouz (BR) und Luminara Labs (CH), wodurch er eine globale community an fans erreicht.
