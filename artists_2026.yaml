    Northwind & Nikora sind das neue Power-Duo der Schweizer Psytrance-Szene. Northwind ist kein unbeschriebenes Blatt: Mit
    Auftritten auf den grössten Bühnen des Landes – von der legendären Street Parade über das Mission und Apocalypse Festival
    bis hin zum Psyriver und Virus Daydance – bringt er jahrelange Erfahrung und das Gespür für den perfekten Moment mit.
    An seiner Seite: Nikora, eine Newcomerin, die durch Herzblut und eine ansteckende Begeisterung besticht. Zusammen präsentieren
    sie Sound, der mitreisst: Psytrance und Progressive Trance, kompromisslos energetisch und extrem basslastig. Ihr Ziel?
    Die Freude, die sie hinter den Decks verbindet, direkt auf die Crowd zu übertragen.'
