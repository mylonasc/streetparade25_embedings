server {
  listen 80;
  server_name _;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /streetparade-navigator-2026 {
    return 301 /streetparade-navigator-2026/;
  }

  location /streetparade-navigator-2026/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /streetparade-navigator-2026/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /streetparade-navigator-2026/index.html;
  }

  location / {
    return 404;
  }
}
