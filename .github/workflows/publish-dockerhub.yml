name: Publish DockerHub Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || secrets.DOCKERHUB_REPOSITORY }}

jobs:
  publish-minimal-images:
    name: Publish Minimal Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read versions
        id: versions
        run: |
          backend_version="$(python - <<'PY'
          import tomllib

          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          frontend_version="$(node -p "require('./fe-visualizer/package.json').version")"
          short_sha="${GITHUB_SHA::12}"
          backend_minor="$(printf '%s' "$backend_version" | cut -d. -f1,2)"
          frontend_minor="$(printf '%s' "$frontend_version" | cut -d. -f1,2)"
          echo "backend_version=${backend_version}" >> "$GITHUB_OUTPUT"
          echo "backend_minor=${backend_minor}" >> "$GITHUB_OUTPUT"
          echo "frontend_version=${frontend_version}" >> "$GITHUB_OUTPUT"
          echo "frontend_minor=${frontend_minor}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Check DockerHub configuration
        run: |
          test -n "$DOCKERHUB_REPOSITORY" || { echo 'Set vars.DOCKERHUB_REPOSITORY or secrets.DOCKERHUB_REPOSITORY to your DockerHub repository, for example username/repository.' >&2; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push minimal API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            API_PROFILE=minimal
            ENABLE_SONG_DL_AND_EMBEDINGS=0
            STREETPARADE_VECTOR_STORE=numpy
          tags: |
            ${{ env.DOCKERHUB_REPOSITORY }}:api-minimal-${{ steps.versions.outputs.backend_minor }}
            ${{ env.DOCKERHUB_REPOSITORY }}:api-minimal-${{ steps.versions.outputs.backend_minor }}-${{ steps.versions.outputs.short_sha }}
            ${{ env.DOCKERHUB_REPOSITORY }}:api-minimal-${{ steps.versions.outputs.backend_version }}
            ${{ env.DOCKERHUB_REPOSITORY }}:api-minimal-${{ steps.versions.outputs.backend_version }}-${{ steps.versions.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=streetparade-api-minimal
            org.opencontainers.image.version=${{ steps.versions.outputs.backend_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push minimal visualizer
        uses: docker/build-push-action@v6
        with:
          context: fe-visualizer
          file: fe-visualizer/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VITE_ENABLE_SONG_DL_AND_EMBEDINGS=false
          tags: |
            ${{ env.DOCKERHUB_REPOSITORY }}:visualizer-minimal-${{ steps.versions.outputs.frontend_minor }}
            ${{ env.DOCKERHUB_REPOSITORY }}:visualizer-minimal-${{ steps.versions.outputs.frontend_minor }}-${{ steps.versions.outputs.short_sha }}
            ${{ env.DOCKERHUB_REPOSITORY }}:visualizer-minimal-${{ steps.versions.outputs.frontend_version }}
            ${{ env.DOCKERHUB_REPOSITORY }}:visualizer-minimal-${{ steps.versions.outputs.frontend_version }}-${{ steps.versions.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=streetparade-visualizer-minimal
            org.opencontainers.image.version=${{ steps.versions.outputs.frontend_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
