name: Deploy Embedding Visualization

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install visualization dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn chromadb

      - name: Build SoundCloud visualization site
        run: |
          python scripts/build_embedding_visualization.py \
            --db streetparade_embeddings.sqlite3 \
            --chroma-dir chroma \
            --out site \
            --playback soundcloud \
            --audio-assets none \
            --start-fraction 0.5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
