name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'deploy/**'
      - '.opencode/**'
      - 'site/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'deploy/**'
      - '.opencode/**'
      - 'site/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      STREETPARADE_VECTOR_STORE: numpy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run backend tests
        run: pytest tests/test_audio.py tests/test_pipeline.py tests/test_api_embedding_service.py tests/test_love_mobile_import.py

  media-fixture-tests:
    name: Media Fixture Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MEDIA_FIXTURE_CACHE: .ci-media-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Download media fixture artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ci-media-fixtures \
            --repo "${{ github.repository }}" \
            --pattern media-fixtures.zip \
            --dir /tmp
          unzip -q /tmp/media-fixtures.zip -d .

      - name: Run media fixture tests
        run: pytest tests/test_media_fixtures.py

  frontend-admin:
    name: Frontend Admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fe-admin/package-lock.json

      - name: Install dependencies
        working-directory: fe-admin
        run: npm ci

      - name: Build admin UI
        working-directory: fe-admin
        run: npm run build

  frontend-visualizer:
    name: Frontend Visualizer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fe-visualizer/package-lock.json

      - name: Install dependencies
        working-directory: fe-visualizer
        run: npm ci

      - name: Test visualizer UI
        working-directory: fe-visualizer
        run: npm run test:run

      - name: Build default visualizer
        working-directory: fe-visualizer
        run: npm run build

  docker-smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-admin
      - frontend-visualizer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose files
        run: |
          docker compose config
          docker compose -f docker-compose.streetparade26.yml config

      - name: Build minimal API image
        run: |
          docker buildx build --load \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg API_PROFILE=minimal \
            --build-arg ENABLE_SONG_DL_AND_EMBEDINGS=0 \
            --build-arg STREETPARADE_VECTOR_STORE=numpy \
            -t streetparade-api-minimal-ci .

      - name: Smoke test minimal API image
        run: |
          docker run --rm streetparade-api-minimal-ci python - <<'PY'
          import importlib.util
          import os
          import tempfile

          os.environ["STREETPARADE_VECTOR_STORE"] = "numpy"
          os.environ["STREETPARADE_NUMPY_VECTOR_DIR"] = tempfile.mkdtemp()

          from streetparade_embeddings.vectorstore import get_vector_store
          import streetparade_embeddings.api

          assert importlib.util.find_spec("chromadb") is None
          assert importlib.util.find_spec("torch") is None
          assert importlib.util.find_spec("yt_dlp") is None
          assert get_vector_store().query_by_vector([1.0, 0.0], n_results=1) == []
          PY

      - name: Build path-agnostic visualizer image
        run: |
          docker buildx build --load \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg VITE_BASE_PATH=./ \
            -f fe-visualizer/Dockerfile \
            -t streetparade-visualizer-ci fe-visualizer

      - name: Check nginx config
        run: docker run --rm streetparade-visualizer-ci nginx -t

      - name: Smoke test path-agnostic visualizer container
        run: |
          docker run -d --rm --name streetparade-visualizer-ci -p 18080:80 streetparade-visualizer-ci
          trap 'docker stop streetparade-visualizer-ci >/dev/null 2>&1 || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:18080/ | grep -q './assets/'

      - name: Smoke test visualizer behind ingress-style base path
        run: |
          docker network create streetparade-visualizer-ci
          mkdir -p /tmp/streetparade-visualizer-ci
          cat > /tmp/streetparade-visualizer-ci/default.conf <<'NGINX'
          server {
            listen 80;
            location ~ ^/streetparade-navigator-2026/api(/|$)(.*)$ {
              rewrite ^/streetparade-navigator-2026/api/?(.*)$ /$1 break;
              proxy_pass http://api:8000;
            }
            location = /streetparade-navigator-2026 {
              return 308 /streetparade-navigator-2026/;
            }
            location ~ ^/streetparade-navigator-2026/(.*)$ {
              rewrite ^/streetparade-navigator-2026/?(.*)$ /$1 break;
              proxy_pass http://visualizer:80;
            }
          }
          NGINX
          trap 'docker rm -f streetparade-visualizer-proxy-ci visualizer api >/dev/null 2>&1 || true; docker network rm streetparade-visualizer-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --rm --network streetparade-visualizer-ci --name api python:3.12-alpine sh -c "mkdir -p /tmp/www/health && printf ok > /tmp/www/health/index.html && cd /tmp/www && python -m http.server 8000"
          docker run -d --rm --network streetparade-visualizer-ci --name visualizer streetparade-visualizer-ci
          docker run -d --rm --network streetparade-visualizer-ci --name streetparade-visualizer-proxy-ci -p 18081:80 -v /tmp/streetparade-visualizer-ci/default.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.27-alpine
          sleep 2
          curl -fsS http://127.0.0.1:18081/streetparade-navigator-2026/ | grep -q './assets/'
          test "$(curl -fsS http://127.0.0.1:18081/streetparade-navigator-2026/api/health/)" = "ok"
