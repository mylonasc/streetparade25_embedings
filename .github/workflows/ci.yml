name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run backend tests
        run: pytest tests/test_audio.py tests/test_pipeline.py tests/test_api_embedding_service.py

  media-fixture-tests:
    name: Media Fixture Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MEDIA_FIXTURE_CACHE: .ci-media-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Download media fixture artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ci-media-fixtures \
            --repo "${{ github.repository }}" \
            --pattern media-fixtures.zip \
            --dir /tmp
          unzip -q /tmp/media-fixtures.zip -d .

      - name: Run media fixture tests
        run: pytest tests/test_media_fixtures.py

  frontend-admin:
    name: Frontend Admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fe-admin/package-lock.json

      - name: Install dependencies
        working-directory: fe-admin
        run: npm ci

      - name: Build admin UI
        working-directory: fe-admin
        run: npm run build

  frontend-visualizer:
    name: Frontend Visualizer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fe-visualizer/package-lock.json

      - name: Install dependencies
        working-directory: fe-visualizer
        run: npm ci

      - name: Build default visualizer
        working-directory: fe-visualizer
        run: npm run build

      - name: Build /streetparade26/ visualizer
        working-directory: fe-visualizer
        env:
          VITE_BASE_PATH: /streetparade26/
          VITE_API_BASE_URL: /streetparade26/api
        run: npm run build

  docker-smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-admin
      - frontend-visualizer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose files
        run: |
          docker compose config
          docker compose -f docker-compose.streetparade26.yml config

      - name: Build streetparade26 visualizer image
        run: docker build -f fe-visualizer/Dockerfile.streetparade26 -t streetparade26-visualizer-ci fe-visualizer

      - name: Check nginx config
        run: docker run --rm streetparade26-visualizer-ci nginx -t

      - name: Smoke test /streetparade26/ container
        run: |
          docker run -d --rm --name streetparade26-visualizer-ci -p 18080:80 streetparade26-visualizer-ci
          trap 'docker stop streetparade26-visualizer-ci >/dev/null 2>&1 || true' EXIT
          sleep 1
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = "404"
          curl -fsS http://127.0.0.1:18080/streetparade26/ | grep -q '/streetparade26/assets/'

      - name: Smoke test visualizer API proxy
        run: |
          docker network create streetparade26-ci
          trap 'docker rm -f streetparade26-visualizer-proxy-ci api >/dev/null 2>&1 || true; docker network rm streetparade26-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --rm --network streetparade26-ci --name api python:3.12-alpine sh -c "mkdir -p /tmp/www/health && printf ok > /tmp/www/health/index.html && cd /tmp/www && python -m http.server 8000"
          docker run -d --rm --network streetparade26-ci --name streetparade26-visualizer-proxy-ci -p 18081:80 streetparade26-visualizer-ci
          sleep 2
          test "$(curl -fsS http://127.0.0.1:18081/streetparade26/api/health/)" = "ok"
